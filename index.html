<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b3d2e'/%3E%3Cpath d='M18 33l9 10 19-22' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Bookends Kitchen Compliance</title>
<style>
:root{
  --brand:#0b3d2e; --brand2:#12674c; --accent:#e8b33a;
  --bg:#f4f5f3; --card:#ffffff; --line:#e2e5e0; --ink:#12181c; --mut:#6a7480;
  --red:#d63b30; --org:#e07b1e; --yel:#d6b400; --grn:#1e8e5a; --blue:#2563c9;
  --r:16px; --sh:0 1px 2px rgba(16,24,32,.06),0 4px 16px rgba(16,24,32,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 0 96px;min-height:100vh}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px;flex:1;line-height:1.15}
.hdr h1 small{display:block;font-size:11px;font-weight:500;opacity:.72;letter-spacing:.6px;text-transform:uppercase}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.28)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--brand)}
.rel{position:relative}
.locbar{margin-top:10px}
.locbar select{width:100%;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#fff;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.locbar select option{color:#12181c}

/* ---------- layout ---------- */
.wrap{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card.pad0{padding:0;overflow:hidden}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin:18px 4px 8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.b{font-weight:700}
.center{text-align:center}
.hide{display:none!important}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:14px;
  background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer;padding:10px 16px;text-align:center}
.btn:active{transform:scale(.985)}
.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.ok{background:var(--grn)} .btn.no{background:var(--red)} .btn.warn{background:var(--org)}
.btn.sm{min-height:44px;font-size:14px;border-radius:11px;padding:8px 12px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px}
.btnrow>.btn{flex:1}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:104px;border:0;border-radius:20px;background:#fff;border:1.5px solid var(--line);
  box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px;text-align:left;cursor:pointer}
.big:active{transform:scale(.985)}
.big .bi{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none}
.big .bt{font-size:21px;font-weight:800;line-height:1.15;letter-spacing:.2px}
.big .bs{font-size:14px;color:var(--mut);font-weight:600;margin-top:3px}
.big .bn{margin-left:auto;font-size:30px;font-weight:900;line-height:1;flex:none}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.step.done .n{background:var(--grn)}
.step.todo .n{background:#d3d8d4;color:#fff}
.photo.tall{min-height:170px}
.fab{position:fixed;right:calc(50% - 380px + 16px);bottom:96px;z-index:60;width:auto;min-height:56px;padding:0 22px;border-radius:28px;
  box-shadow:0 8px 24px rgba(11,61,46,.34);display:flex;align-items:center;gap:9px;background:var(--brand);color:#fff;font-weight:700;border:0;font-size:16px;cursor:pointer}
@media(max-width:792px){.fab{right:16px}}

/* ---------- tabbar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tabs-in{max-width:760px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab.on{color:var(--brand)}
.tab .tcount{background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 4px;margin-left:4px;vertical-align:middle}

/* ---------- pills / status ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.p-red{background:#fdecea;color:#a12a21} .p-org{background:#fdf0e0;color:#a3550f}
.p-yel{background:#fbf6d9;color:#8a7300}
.p-grn{background:#e6f5ee;color:#106041} .p-gry{background:#eef0ee;color:#5c6670}
.p-blu{background:#e8f0fd;color:#1e4fa3}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;width:100%;border:0;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow:active{background:#f7f8f6}
.lrow .t{font-weight:650;font-size:15px;line-height:1.25}
.thumb{width:46px;height:46px;border-radius:11px;object-fit:cover;background:#eceee9;flex:none}
.chev{color:#c2c8cc;font-size:20px;flex:none}

/* ---------- meters ---------- */
.bar{height:9px;border-radius:6px;background:#e9ebe7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--grn);transition:width .4s}
.ring{display:block;margin:0 auto}
.ring .tr{stroke:rgba(255,255,255,.2)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.stat span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.3px;text-transform:uppercase}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.inp{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff;font-size:16px}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='%236a7480'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.inp:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(18,103,76,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;color:var(--mut);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- photo ---------- */
.photo{position:relative;border:2px dashed #cfd5d0;border-radius:14px;background:#fafbfa;min-height:120px;display:grid;place-items:center;text-align:center;padding:10px;cursor:pointer;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph-t{font-size:12.5px;font-weight:800;color:var(--mut)}
.photo .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:2}
.photo .x{position:absolute;right:6px;top:6px;z-index:3;background:rgba(0,0,0,.6);color:#fff;border:0;width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer}

/* ---------- sheet / modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(10,16,20,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;animation:up .22s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
@keyframes up{from{transform:translateY(30px)}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:14px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h2{margin:0;font-size:17px;flex:1;font-weight:800;line-height:1.2}
.sheet-b{padding:14px}

/* ---------- label print ---------- */
.lbl{background:#fff;border:2px solid #111;border-radius:8px;padding:12px;display:flex;gap:12px;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.lbl .qr{width:104px;flex:none}
.lbl .qr svg{width:100%;height:auto;display:block}
.lbl .f{flex:1;min-width:0}
.lbl .nm{font-size:17px;font-weight:900;line-height:1.15;margin-bottom:2px;text-transform:uppercase}
.lbl .kv{font-size:11.5px;line-height:1.5}
.lbl .kv b{display:inline-block;min-width:64px;font-weight:800}
.lbl .exp{margin-top:5px;background:#111;color:#fff;padding:3px 7px;border-radius:5px;font-size:12.5px;font-weight:900;display:inline-block}
.lbl .brand{font-size:9px;letter-spacing:1.6px;font-weight:800;color:#555;margin-top:6px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:9px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- in-app dialogs (never use browser popups) ---------- */
.dlg-ovl{position:fixed;inset:0;background:rgba(10,16,20,.55);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .12s}
.dlg{background:#fff;border-radius:20px;max-width:400px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .18s}
.dlg h3{margin:0 0 6px;font-size:18px;font-weight:800;line-height:1.25}
.dlg p{margin:0 0 16px;font-size:14.5px;color:var(--mut);line-height:1.5}
.dlg .inp{margin-bottom:16px}

/* ---------- printing (no pop-up windows — iOS blocks them) ---------- */
#printarea{display:none}
@media print{
  #app,#tabbar,#modal,#dialog,.netbar,.toast{display:none!important}
  #printarea{display:block!important}
  .lbl-sheet{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
}

/* ---------- handwritten label card ---------- */
.wl{background:#fff;border:3px solid #111;border-radius:14px;padding:16px}
.wl .r{display:flex;align-items:baseline;gap:10px;border-bottom:2px dashed #c8ccc9;padding:10px 0}
.wl .r:last-child{border-bottom:0}
.wl .k{font-size:11px;font-weight:900;letter-spacing:.8px;color:#6a7480;text-transform:uppercase;width:96px;flex:none}
.wl .v{font-size:21px;font-weight:900;line-height:1.15;word-break:break-word}
.wl .v.big{font-size:26px}
.wl .hl{background:#111;color:#fff;padding:2px 8px;border-radius:6px;display:inline-block}

/* ---------- laptop / desktop ---------- */
@media (min-width:900px){
  #app{max-width:none;padding:0 0 40px 232px}
  .hdr{padding-left:22px;padding-right:22px}
  .wrap{padding:22px 26px;max-width:1240px}
  .tabs{left:0;right:auto;top:0;bottom:0;width:232px;border-top:0;border-right:1px solid var(--line);
    padding:0;background:#0b3d2e;flex-direction:column}
  .tabs-in{flex-direction:column;max-width:none;width:232px;padding:18px 12px;gap:4px}
  .tabs-in::before{content:'BOOKENDS';display:block;color:#fff;font-size:13px;font-weight:800;letter-spacing:2px;padding:8px 14px 18px;opacity:.9}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 14px;border-radius:12px;
    font-size:14.5px;color:rgba(255,255,255,.72)}
  .tab svg{width:21px;height:21px}
  .tab.on{background:rgba(255,255,255,.14);color:#fff}
  .tab:hover{background:rgba(255,255,255,.08)}
  .fab{right:34px;bottom:34px}
  .grid2{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(6,1fr)}
  .dash2{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
  .dash2>*{margin-bottom:0}
  .loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .loc-grid .card{margin-bottom:0}
  .sheet{max-width:720px;border-radius:20px;max-height:88vh;align-self:center}
  .ovl{align-items:center}
  .btn:hover{filter:brightness(1.06)}
  .lrow:hover{background:#f7f8f6}
}
@media (min-width:1280px){ .wrap{padding:24px 40px} }
.netbar{position:fixed;left:0;right:0;top:0;z-index:300;background:#8a5a00;color:#fff;font-size:12.5px;font-weight:700;
  text-align:center;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
.netbar ~ #app .hdr{top:34px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:200;background:#12181c;color:#fff;padding:13px 20px;border-radius:14px;font-size:14.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:88%;text-align:center;animation:up .2s}
.empty{text-align:center;padding:38px 20px;color:var(--mut)}
.empty .ic{font-size:40px;margin-bottom:8px;opacity:.55}

/* ---------- small-phone hardening (≤380px, e.g. iPhone SE, budget Android) ---------- */
@media screen and (max-width:380px){
  html,body{overflow-x:hidden}

  .grid3{grid-template-columns:repeat(2,1fr);gap:8px}
  .grid3>*{min-width:0}
  .grid3>*:nth-child(3):last-child{grid-column:1 / -1}
  .stat{padding:10px 8px}
  .stat b{font-size:20px}
  .stat span{font-size:10px}

  .lbl{flex-direction:column}
  .lbl .qr{width:auto;max-width:130px;margin:0 auto}
  .lbl .nm,.lbl .kv{overflow-wrap:break-word;word-break:break-word}

  .wl{padding:12px}
  .wl .r{gap:8px}
  .wl .k{width:72px;font-size:10px}
  .wl .v{font-size:18px}
  .wl .v.big{font-size:22px}

  .big{gap:10px;padding:14px 12px;min-height:88px}
  .big .bi{width:52px;height:52px;font-size:26px}
  .big .bt{font-size:17px}
  .big .bs{font-size:12.5px}
  .big .bn{font-size:24px}

  .hdr-row{gap:8px}
  .iconbtn{width:38px;height:38px;font-size:17px}
  .hdr h1{font-size:14px}
  .hdr h1 small{font-size:10px}
}

@media print{
  body{background:#fff}
  .hdr,.tabs,.fab,.noprint,.sheet-h{display:none!important}
  #app{padding:0;max-width:none}
  .ovl{position:static;background:none;display:block}
  .sheet{max-height:none;border-radius:0;box-shadow:none;background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  .print-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
}

<body>
<div id="app"><div style="padding:60px 24px;text-align:center;color:#6a7480;font-size:14px">Loading Bookends…</div></div>
<div id="tabbar"></div>
<div id="modal"></div>
<div id="dialog"></div>
<div id="printarea"></div>
<script>
window.onerror = function (msg, src, line) {
  var a = document.getElementById('app');
  if (!a) return;
  a.innerHTML = '<div style="padding:26px;font-family:-apple-system,Segoe UI,Arial,sans-serif">' +
    '<div style="font-size:38px">⚠️</div>' +
    '<h2 style="margin:8px 0 6px;font-size:19px">The app could not start</h2>' +
    '<p style="color:#6a7480;font-size:14px;line-height:1.5">Please close this tab and open the link again. ' +
    'If it keeps happening, send this message to Husen:</p>' +
    '<pre style="background:#f4f5f3;padding:12px;border-radius:10px;font-size:11px;white-space:pre-wrap;overflow:auto">' +
    String(msg) + '\nline ' + line + '</pre></div>';
};

/* QR */
/* ---------- Offline QR encoder (byte mode, versions 1-10, ECC level M) ---------- */
var QR = (function () {
  // total codewords per version (1..10)
  var TOTAL_CW = [0, 26, 44, 70, 100, 134, 172, 196, 242, 292, 346];
  // [ecPerBlock, blocks1, data1, blocks2, data2] for ECC level M
  var RS_M = [
    null,
    [10, 1, 16, 0, 0],
    [16, 1, 28, 0, 0],
    [26, 1, 44, 0, 0],
    [18, 2, 32, 0, 0],
    [24, 2, 43, 0, 0],
    [16, 4, 27, 0, 0],
    [18, 4, 31, 0, 0],
    [22, 2, 38, 2, 39],
    [22, 3, 36, 2, 37],
    [26, 4, 43, 1, 44]
  ];
  var ALIGN = [
    [], [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
    [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]
  ];

  // Galois field tables
  var EXP = new Array(512), LOG = new Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();
  function gmul(a, b) { if (a === 0 || b === 0) return 0; return EXP[LOG[a] + LOG[b]]; }

  function rsGenPoly(n) {
    var poly = [1];
    for (var i = 0; i < n; i++) {
      var next = new Array(poly.length + 1).fill(0);
      for (var j = 0; j < poly.length; j++) {
        next[j] ^= poly[j];
        next[j + 1] ^= gmul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly;
  }

  function rsEncode(data, ecLen) {
    var gen = rsGenPoly(ecLen);
    var res = new Array(ecLen).fill(0);
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ res[0];
      res.shift(); res.push(0);
      if (factor !== 0) {
        for (var j = 0; j < ecLen; j++) res[j] ^= gmul(gen[j + 1], factor);
      }
    }
    return res;
  }

  function bchFormat(fmt) {
    var d = fmt << 10;
    for (var i = 4; i >= 0; i--) if (d & (1 << (i + 10))) d ^= 0x537 << i;
    return ((fmt << 10) | d) ^ 0x5412;
  }
  function bchVersion(ver) {
    var d = ver << 12;
    for (var i = 5; i >= 0; i--) if (d & (1 << (i + 12))) d ^= 0x1f25 << i;
    return (ver << 12) | d;
  }

  function utf8Bytes(str) {
    var out = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else if (c < 0xd800 || c >= 0xe000) { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }
      else {
        i++;
        var cp = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      }
    }
    return out;
  }

  function pickVersion(byteLen) {
    for (var v = 1; v <= 10; v++) {
      var r = RS_M[v];
      var dataCw = r[1] * r[2] + r[3] * r[4];
      var ccBits = v < 10 ? 8 : 16;
      var need = 4 + ccBits + byteLen * 8;
      if (need <= dataCw * 8) return v;
    }
    return -1;
  }

  function buildCodewords(bytes, ver) {
    var r = RS_M[ver];
    var dataCw = r[1] * r[2] + r[3] * r[4];
    var ccBits = ver < 10 ? 8 : 16;
    var bits = [];
    function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    put(4, 4);
    put(bytes.length, ccBits);
    for (var i = 0; i < bytes.length; i++) put(bytes[i], 8);
    var cap = dataCw * 8;
    var term = Math.min(4, cap - bits.length);
    put(0, term);
    while (bits.length % 8 !== 0) bits.push(0);
    var cws = [];
    for (var b = 0; b < bits.length; b += 8) {
      var v = 0; for (var k = 0; k < 8; k++) v = (v << 1) | bits[b + k];
      cws.push(v);
    }
    var pad = [0xec, 0x11], pi = 0;
    while (cws.length < dataCw) { cws.push(pad[pi % 2]); pi++; }

    // split into blocks
    var blocks = [], ecBlocks = [], pos = 0, n;
    for (n = 0; n < r[1]; n++) { blocks.push(cws.slice(pos, pos + r[2])); pos += r[2]; }
    for (n = 0; n < r[3]; n++) { blocks.push(cws.slice(pos, pos + r[4])); pos += r[4]; }
    for (n = 0; n < blocks.length; n++) ecBlocks.push(rsEncode(blocks[n], r[0]));

    var out = [], maxD = Math.max(r[2], r[4] || 0), c;
    for (c = 0; c < maxD; c++) for (n = 0; n < blocks.length; n++) if (c < blocks[n].length) out.push(blocks[n][c]);
    for (c = 0; c < r[0]; c++) for (n = 0; n < ecBlocks.length; n++) out.push(ecBlocks[n][c]);
    return out;
  }

  function makeMatrix(ver) {
    var size = ver * 4 + 17;
    var m = [], res = [], i, j;
    for (i = 0; i < size; i++) { m.push(new Array(size).fill(null)); res.push(new Array(size).fill(false)); }

    function finder(r0, c0) {
      for (var dr = -1; dr <= 7; dr++) for (var dc = -1; dc <= 7; dc++) {
        var r = r0 + dr, c = c0 + dc;
        if (r < 0 || c < 0 || r >= size || c >= size) continue;
        var inRing = (dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6);
        var dark = false;
        if (inRing) {
          dark = (dr === 0 || dr === 6 || dc === 0 || dc === 6) ||
                 (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        }
        m[r][c] = dark; res[r][c] = true;
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

    // timing
    for (i = 8; i < size - 8; i++) {
      m[6][i] = (i % 2 === 0); res[6][i] = true;
      m[i][6] = (i % 2 === 0); res[i][6] = true;
    }
    // alignment
    var ap = ALIGN[ver];
    for (i = 0; i < ap.length; i++) for (j = 0; j < ap.length; j++) {
      var ar = ap[i], ac = ap[j];
      if ((ar <= 8 && ac <= 8) || (ar <= 8 && ac >= size - 9) || (ar >= size - 9 && ac <= 8)) continue;

    for (i = 0; i < 9; i++) {

      if (!res[i][8]) { res[i][8] = true; m[i][8] = false; }
    }
    for (i = 0; i < 8; i++) {
      res[8][size - 1 - i] = true; m[8][size - 1 - i] = false;
      res[size - 1 - i][8] = true; m[size - 1 - i][8] = false;
    }

    m[size - 8][8] = true; res[size - 8][8] = true;

  function placeData(mm, cws) {
    var m = mm.m, res = mm.res, size = mm.size;
    var bitIdx = 0, total = cws.length * 8;
    function nextBit() {
      if (bitIdx >= total) return false;
      var b = (cws[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1;
      bitIdx++;
      return b === 1;
    }
    var up = true;
    for (var col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;

          var cc = col - c;
          if (!res[row][cc]) m[row][cc] = nextBit();

      }
      up = !up;
    }
  }

  function applyMask(m, res, size, mask) {
    var out = [];
    for (var r = 0; r < size; r++) {
      out.push([]);
      for (var c = 0; c < size; c++) {
        var v = m[r][c];
        if (!res[r][c]) {
          var f;
          switch (mask) {
            case 0: f = (r + c) % 2 === 0; break;
            case 1: f = r % 2 === 0; break;
            case 2: f = c % 3 === 0; break;
            case 3: f = (r + c) % 3 === 0; break;
            case 4: f = (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0; break;
            case 5: f = ((r * c) % 2) + ((r * c) % 3) === 0; break;
            case 6: f = (((r * c) % 2) + ((r * c) % 3)) % 2 === 0; break;

        }

      }

    return out;

  function drawFormat(g, size, mask) {
    var fmt = bchFormat((0 << 3) | mask); // 00 = ECC level M

      else g[size - 15 + i][8] = bit;

  function penalty(g, size) {
    var p = 0, r, c, i, run, prev;

    for (r = 0; r < size; r++) {
      run = 1; prev = g[r][0];
      for (c = 1; c < size; c++) {
        if (g[r][c] === prev) run++;
        else { if (run >= 5) p += 3 + (run - 5); run = 1; prev = g[r][c]; }
      }
      if (run >= 5) p += 3 + (run - 5);
    }
    for (c = 0; c < size; c++) {
      run = 1; prev = g[0][c];
      for (r = 1; r < size; r++) {
        if (g[r][c] === prev) run++;
        else { if (run >= 5) p += 3 + (run - 5); run = 1; prev = g[r][c]; }
      }
      if (run >= 5) p += 3 + (run - 5);

    for (r = 0; r < size - 1; r++) for (c = 0; c < size - 1; c++) {

    }
    // rule 3
    var pat1 = [true, false, true, true, true, false, true, false, false, false, false];
    var pat2 = [false, false, false, false, true, false, true, true, true, false, true];
    function match(arr, pat) {
      for (var k = 0; k < 11; k++) if (arr[k] !== pat[k]) return false;

    }
    for (r = 0; r < size; r++) for (c = 0; c <= size - 11; c++) {
      var hz = []; for (i = 0; i < 11; i++) hz.push(g[r][c + i]);
      if (match(hz, pat1) || match(hz, pat2)) p += 40;
    }
    for (c = 0; c < size; c++) for (r = 0; r <= size - 11; r++) {
      var vt = []; for (i = 0; i < 11; i++) vt.push(g[r + i][c]);
      if (match(vt, pat1) || match(vt, pat2)) p += 40;
    }
    // rule 4
    var dark = 0;
    for (r = 0; r < size; r++) for (c = 0; c < size; c++) if (g[r][c]) dark++;
    var pct = (dark * 100) / (size * size);
    p += Math.floor(Math.abs(pct - 50) / 5) * 10;

  function encode(text) {

    for (var mask = 0; mask < 8; mask++) {

      '" viewBox="0 0 ' + total + ' ' + total + '" shape-rendering="crispEdges">' +

/* =====================================================================
   AUTH — talks to the backend at /api

   Everything about passwords now happens on the server. This file never
   sees a password hash and never stores a password; it posts the typed
   password once over HTTPS and keeps only a short-lived access token in a
   variable.

   Why the access token lives in a variable and not in localStorage:
   anything in localStorage is readable by any script on the page and
   survives forever. The long-lived half of the session is an httpOnly
   cookie the server sets, which JavaScript cannot read at all, and
   Auth.boot() trades it for a fresh access token on every start.
   ===================================================================== */

/* Same origin when Express serves this file, which is the normal setup.
   Point this at the backend's URL if you host index.html separately, e.g.
   var API_BASE = 'https://bookends-api.onrender.com'; */
var API_BASE = '';

var Api = {
  token: null,            // access token — memory only, never persisted
  expiresAt: 0,           // epoch ms when the access token dies
  refreshTimer: null,
  refreshing: null,       // in-flight refresh, shared so we never run two

  url: function (path) { return API_BASE + path; },

  /* One fetch wrapper for every call.

     - attaches the bearer token
     - sends cookies (credentials) so the refresh cookie travels
     - on an expired token, refreshes once and replays the request, so the
       user is never interrupted mid-task by a 15-minute expiry
     - turns a non-2xx into a rejected promise carrying the server's
       message, so callers can show it directly */
  call: function (method, path, body, opts) {
    opts = opts || {};
    var self = this;
    var headers = { 'Accept': 'application/json' };
    if (body !== undefined && body !== null) headers['Content-Type'] = 'application/json';
    if (this.token && !opts.noAuth) headers.Authorization = 'Bearer ' + this.token;

    return fetch(this.url(path), {
      method: method,
      headers: headers,
      credentials: 'include',
      body: body === undefined || body === null ? undefined : JSON.stringify(body)
    }).then(function (r) {
      return r.text().then(function (text) {
        var data = null;
        if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }

        if (r.ok) return data === null ? {} : data;

        /* The access token expired. Refresh once and replay. The retry flag
           stops an endless loop if the refresh itself 401s. */
        if (r.status === 401 && data && data.code === 'TOKEN_EXPIRED' && !opts._retried) {
          return self.refresh().then(function () {
            return self.call(method, path, body, { _retried: true, noAuth: opts.noAuth });
          });
        }

        var err = new Error((data && data.error) || ('Request failed (' + r.status + ')'));
        err.status = r.status;
        err.code = (data && data.code) || 'HTTP_' + r.status;
        throw err;
      });
    }, function () {
      /* fetch only rejects when the network itself failed. Flagged so
         callers can say "you are offline" instead of "wrong password". */
      var err = new Error('No connection to the server. Check your internet and try again.');
      err.offline = true;
      err.code = 'OFFLINE';
      throw err;
    });
  },

  get:  function (p)    { return this.call('GET', p, null); },
  post: function (p, b) { return this.call('POST', p, b === undefined ? {} : b); },
  patch:function (p, b) { return this.call('PATCH', p, b); },
  del:  function (p)    { return this.call('DELETE', p, null); },

  /* Stores a session returned by login / refresh / change-password and
     schedules the next silent refresh at 80% of the token's life. */
  adopt: function (data) {
    this.token = data.accessToken || null;
    this.expiresAt = Date.now() + ((data.expiresIn || 900) * 1000);
    if (this.refreshTimer) clearTimeout(this.refreshTimer);
    var self = this;
    var delay = Math.max(30000, (data.expiresIn || 900) * 800);
    this.refreshTimer = setTimeout(function () {
      self.refresh().catch(function () { /* the next API call will retry */ });
    }, delay);
    return data;
  },

  clear: function () {
    this.token = null;
    this.expiresAt = 0;
    if (this.refreshTimer) { clearTimeout(this.refreshTimer); this.refreshTimer = null; }
  },

  /* Trades the httpOnly refresh cookie for a new access token. Concurrent
     callers share one request rather than each rotating the token. */
  refresh: function () {
    var self = this;
    if (this.refreshing) return this.refreshing;

    this.refreshing = this.call('POST', '/api/auth/refresh', {}, { noAuth: true })
      .then(function (data) {
        self.refreshing = null;
        self.adopt(data);
        if (data.user) Auth.adoptUser(data.user);
        return data;
      }, function (err) {
        self.refreshing = null;
        throw err;
      });

    return this.refreshing;
  }
};

/* ---------------------------------------------------------------------
   Auth — session state and the calls the UI makes
   --------------------------------------------------------------------- */
var Auth = {
  /* True when we could not reach the server at start-up but had a cached
     profile. The app stays usable on the existing local data; anything
     that needs the server says so when it is tried. */
  offline: false,

  /* Caches hold no secrets: a profile (name, role, location) and the staff
     roster. Both are things the UI already displayed on screen. */
  PROFILE_KEY: 'bookends.profile.v1',
  ROSTER_KEY: 'bookends.roster.v1',

  adoptUser: function (user) {
    ME = user;
    this.offline = false;
    try { localStorage.setItem(this.PROFILE_KEY, JSON.stringify(user)); } catch (e) { }
    /* Keep the roster copy of this user in step, so the header and the
       people list agree straight after a role change. */
    var i = DB.users.map(function (u) { return u.id; }).indexOf(user.id);
    if (i > -1) DB.users[i] = mergeRosterEntry(DB.users[i], user);
    else DB.users.push(mergeRosterEntry(null, user));
    saveLocal();
    return user;
  },

  cachedProfile: function () {
    try { return JSON.parse(localStorage.getItem(this.PROFILE_KEY)) || null; } catch (e) { return null; }
  },

  forget: function () {
    if (typeof Cloud !== 'undefined') Cloud.stop();
    Api.clear();
    ME = null;
    PENDING_SIGNUPS = 0;
    RESET_REQUESTS = 0;
    this.offline = false;
    try { localStorage.removeItem(this.PROFILE_KEY); } catch (e) { }
    try { localStorage.removeItem(SESS); } catch (e) { }

  login: function (uid, password) {
    var self = this;
    return Api.call('POST', '/api/auth/login', { uid: uid, password: password }, { noAuth: true })
      .then(function (data) {
        Api.adopt(data);
        self.adoptUser(data.user);
        return self.loadRoster().then(function () { return data; }, function () { return data; });
      });
  },

  logout: function () {
    var self = this;
    /* Revoke server-side first, but sign out locally even if that call
       cannot be made — the user asked to be logged out. */
    return Api.call('POST', '/api/auth/logout', {}, { noAuth: true })
      .catch(function () { return null; })
      .then(function () { self.forget(); });
  },

  changePassword: function (currentPassword, newPassword, confirmPassword) {
    var self = this;
    return Api.post('/api/auth/change-password', {
      currentPassword: currentPassword,
      newPassword: newPassword,
      confirmPassword: confirmPassword
    }).then(function (data) {
      Api.adopt(data);
      self.adoptUser(data.user);
      return data;
    });
  },

  /* The staff list, used for names, initials and job assignment. Contains
     no credential material — the endpoint physically cannot return one. */
  loadRoster: function () {
    return Api.get('/api/users/roster').then(function (data) {
      var incoming = data.users || [];
      var byId = {};
      DB.users.forEach(function (u) { byId[u.id] = u; });
      DB.users = incoming.map(function (u) { return mergeRosterEntry(byId[u.id], u); });
      try { localStorage.setItem(Auth.ROSTER_KEY, JSON.stringify(DB.users)); } catch (e) { }
      saveLocal();
      return DB.users;
    });
  },

  restoreRosterFromCache: function () {
    try {
      var cached = JSON.parse(localStorage.getItem(this.ROSTER_KEY));
      if (cached && cached.length) DB.users = cached;
    } catch (e) { }
  },

  /* Runs once at start-up.

     Success  -> signed in without the user typing anything (the cookie did it)
     401      -> no session, show the login screen
     offline  -> fall back to the cached profile so the app still opens */
  boot: function (done) {
    var self = this;

    /* Non-secret settings (the starting password shown in the UI copy).
       Never blocks boot. */
    Api.call('GET', '/api/config', null, { noAuth: true }).then(function (cfg) {
      if (cfg.defaultPassword) DEFAULT_PW = cfg.defaultPassword;
      if (cfg.minPasswordLength) MIN_PW_LEN = cfg.minPasswordLength;
    }).catch(function () { });

    Api.refresh().then(function () {
      return self.loadRoster().catch(function () { self.restoreRosterFromCache(); });
    }).then(function () {
      done();
    }).catch(function (err) {
      if (err && err.offline) {
        /* No network. Open on the cached profile and local data rather than
           locking a kitchen out of its checklist because the wifi is down. */
        var cached = self.cachedProfile();
        if (cached) {
          ME = cached;
          self.offline = true;
          self.restoreRosterFromCache();
          done();
          return;
        }
      }
      /* No session, or no cached profile to fall back on. */
      self.forget();
      done();
    });
  }
};

/* Roster entries carry no password fields. Merging rather than replacing
   keeps any local-only bookkeeping (_u) that the sync layer relies on. */
function mergeRosterEntry(existing, incoming) {
  var out = existing ? existing : {};
  out.id = incoming.id;
  out.uid = incoming.uid;
  out.name = incoming.name;
  out.role = incoming.role;
  out.loc = incoming.loc;
  if (incoming.mustChange !== undefined) out.mustChange = incoming.mustChange;
  if (incoming.lastLogin !== undefined) out.lastLogin = incoming.lastLogin;
  if (incoming.createdAt !== undefined) out.createdAt = incoming.createdAt;
  out._u = incoming._u || Date.now();
  /* Belt and braces: if an old cached record still carries a password from
     the previous version of the app, drop it here. */
  if (out.pw !== undefined) delete out.pw;
  return out;
}

      seen[kind][remote.id] = 1;
      var rt = remote._u || new Date(row.updated_at).getTime() || 0;
      var pos = idx[remote.id];
      if (remote.deleted) {
        if (pos !== undefined) { arr.splice(pos, 1); idx = {}; arr.forEach(function (o, n) { idx[o.id] = n; }); changed = true; }
        return;
      }
      if (pos === undefined) {
        remote._u = rt; arr.push(remote); idx[remote.id] = arr.length - 1; changed = true;
      } else {
        var local = arr[pos];
        /* An edit not yet uploaded wins only when it is genuinely newer. */
        if (this.dirty[kind][local.id]) {
          if ((local._u || 0) >= rt) return;
          delete this.dirty[kind][local.id];
        }
        if (first || rt > (local._u || 0)) { remote._u = rt; arr[pos] = remote; changed = true; }
      }
    }, this);
    return changed;
  },

  /* ---------- photo upload ----------
     Sends the image bytes to /api/photos, which stores them and answers with
     a permanent URL. Any failure (offline, no photo store configured) hands
     back the original data: URL so the photo stays on the device and is
     tried again the next time the record is saved. */
  uploadPhoto: function (dataUrl, loc, cb) {
    if (!this.on() || !dataUrl || dataUrl.indexOf('data:') !== 0) { cb('off', dataUrl); return; }
    var bin, mime = 'image/jpeg';
    try {
      var parts = dataUrl.split(',');
      mime = (parts[0].match(/:(.*?);/) || [0, 'image/jpeg'])[1];
      var raw = atob(parts[1]), u8 = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) u8[i] = raw.charCodeAt(i);
      bin = u8;
    } catch (e) { cb('bad image', dataUrl); return; }

    function send(retried) {
      return fetch(Api.url('/api/photos' + (loc ? '?loc=' + encodeURIComponent(loc) : '')), {
        method: 'POST',
        headers: { 'Content-Type': mime, 'Authorization': 'Bearer ' + Api.token, 'Accept': 'application/json' },
        credentials: 'include',
        body: bin
      }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (data) {
          if (r.ok && data.url) { cb(null, data.url); return; }
          if (r.status === 401 && data.code === 'TOKEN_EXPIRED' && !retried) {
            return Api.refresh().then(function () { return send(true); }, function () { cb('signed out', dataUrl); });
          }
          cb(data.error || 'upload failed', dataUrl);
        });
      }).catch(function () { cb('offline', dataUrl); });
    }
    send(false);
  },

  setState: function (s, err) {
    this.state = s; this.err = err || '';
    var el = document.getElementById('cloudDot');
    if (el) el.outerHTML = cloudDot();
  },
  label: function () {
    if (!this.on()) return navigator.onLine ? 'Not signed in' : 'Offline — will upload later';
    if (this.state === 'error') return 'Sync problem';
    if (this.state === 'syncing') return 'Syncing…';
    var p = this.pendingCount();
    return p ? p + ' waiting to upload' : 'All devices in sync';
  }
};

/* ---------- camera capture + compress ---------- */
function capture(cb) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; if (!f) { inp.remove(); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 640, sc = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        var x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
        var stamp = fmtDT(Date.now()) + '  ·  ' + (ME ? initials(ME.name) : '');
        x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, c.height - 20, c.width, 20);
        x.fillStyle = '#fff'; x.font = 'bold 11px sans-serif'; x.fillText(stamp, 6, c.height - 6);
        cb(c.toDataURL('image/jpeg', 0.5)); inp.remove();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

function doSignup() {
  if (SIGNUP_BUSY) return;
  var name = (document.getElementById('s_name').value || '').trim();
  var uid = (document.getElementById('s_uid').value || '').trim().toLowerCase();
  var loc = document.getElementById('s_loc').value;
  var pw = document.getElementById('s_pw').value || '';
  var pw2 = document.getElementById('s_pw2').value || '';
  SIGNUP_DRAFT = { name: name, uid: uid, loc: loc };

  function showError(msg) { SIGNUP_ERR = msg; renderSignup(); }

  /* Instant answers for the obvious mistakes; the server checks all of it again. */
  if (name.length < 2) { showError('Enter your name'); return; }
  if (!/^[a-z0-9]{2,32}$/.test(uid)) { showError('Username: 2 to 32 lower case letters or numbers, no spaces'); return; }
  if (!loc) { showError('Choose your kitchen'); return; }
  if (pw.length < MIN_PW_LEN) { showError('Password must be at least ' + MIN_PW_LEN + ' characters'); return; }
  if (pw !== pw2) { showError('The two passwords do not match'); return; }
  if (pw === DEFAULT_PW) { showError('Please choose something other than ' + DEFAULT_PW); return; }

  SIGNUP_BUSY = true;
  var btn = document.getElementById('s_btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }

  Api.call('POST', '/api/auth/register',
    { name: name, uid: uid, loc: loc, password: pw, confirmPassword: pw2 }, { noAuth: true })
    .then(function (data) {
      SIGNUP_BUSY = false;
      SIGNUP_ERR = '';
      SIGNUP_DRAFT = { name: '', uid: '', loc: '' };
      LOGIN_UID = data.user.uid;      /* so the login screen is ready for them later */
      renderSignupDone(data.user);
    }, function (err) {
      SIGNUP_BUSY = false;
      showError(err.message || 'Could not create the account');
    });
}

function doForgot() {

    '<button class="btn sec" data-a="logout">Sign in as someone else</button></div>';

/* The new password is hashed on the server; this only collects and posts it.
   The server re-checks every rule, so the local checks below are purely so
   the user gets an instant answer for the obvious mistakes. */
var PW_BUSY = false;
function savePw(force) {
  if (PW_BUSY) return;

  var a = document.getElementById('p_new').value || '', b = document.getElementById('p_new2').value || '';
  var cur = document.getElementById('p_cur');
  var currentPassword = cur ? (cur.value || '') : '';

  function showError(msg) {
    PW_ERR = msg;
    if (force) renderSetPassword(); else { closeSheet(); changePwSheet(); }
  }

  if (a.length < MIN_PW_LEN) { showError('Password must be at least ' + MIN_PW_LEN + ' characters'); return; }
  if (a !== b) { showError('The two passwords do not match'); return; }
  if (a === DEFAULT_PW) { showError('Please choose something other than ' + DEFAULT_PW); return; }

  PW_BUSY = true;
  var btn = document.getElementById('p_btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }

  Auth.changePassword(currentPassword, a, b).then(function () {
    PW_BUSY = false;
    PW_ERR = '';
    logAct('user', 'Password changed', ME.loc);
    if (force) { render(); startSync(); } else { closeSheet(); render(); }
    toast('Password updated');
  }, function (err) {
    PW_BUSY = false;
    showError(err.message || 'Could not change your password');
  });
}

function changePwSheet() {
  openSheet('Change your password',
    '<div class="card sm muted">Your ID is <b>' + h(ME.uid) + '</b>. It cannot be changed — only an Execution Head can do that.</div>' +
    '<div class="card">' +
    /* Asked for outside the forced-change flow: it stops a phone left
       unlocked on a counter being used to take the account over. */
    '<label class="f"><span>Current password</span><input class="inp" id="p_cur" type="password" autocomplete="current-password"></label>' +
    '<label class="f"><span>New password</span><input class="inp" id="p_new" type="password" placeholder="At least ' + MIN_PW_LEN + ' characters" autocomplete="new-password"></label>' +
    '<label class="f"><span>Type it again</span><input class="inp" id="p_new2" type="password" autocomplete="new-password"></label>' +
    (PW_ERR ? '<div class="card" style="background:#fdecea;border-color:#f6c9c4;margin:0 0 12px"><b class="sm">' + h(PW_ERR) + '</b></div>' : '') +
    '<button class="btn" id="p_btn" data-a="savePwSheet">Save new password</button></div>');
}

   so the count is fetched for them and shown on their home screen. Nobody
   else can approve, so nobody else is shown it. Re-renders only when the number actually changes. */
var PENDING_SIGNUPS = 0;
var RESET_REQUESTS = 0;      /* "Forgot password?" requests not yet answered */
function refreshPendingSignups() {
  if (!ME || ME.mustChange || !perm().superadmin || !Api.token) return;
  Api.get('/api/admin/users').then(function (data) {
    var list = data.users || [];
    var n = list.filter(function (u) { return u.pending; }).length;
    var r = list.filter(function (u) { return u.resetRequestedAt && !u.pending; }).length;
    if (n === PENDING_SIGNUPS && r === RESET_REQUESTS) return;
    PENDING_SIGNUPS = n; RESET_REQUESTS = r;
    tabbar();                    /* sidebar count, on every tab */
    if (S.tab === 'home' && !$('#modal').innerHTML) render();
  }, function () { /* offline or signed out — keep the last known count */ });
}

/* Home dashboard: this week's every-Tuesday jobs. One location shows the jobs
   themselves; "All locations" shows how far each kitchen has got. */
function tuesdayCard(scope, wk) {
  var locs = scope ? [locById(scope)] : visibleLocations();
  var rows = locs.map(function (L) {
    var ts = tasksFor(L.id, wk, 'W').filter(isTuesdayJob);
    return { L: L, ts: ts, done: ts.filter(function (t) { return t.status === 'completed'; }).length };
  });
  var total = 0, done = 0;
  rows.forEach(function (r) { total += r.ts.length; done += r.done; });

  var out = '<div class="sec-t">Cleaning · every Tuesday</div><div class="card pad0">';
  if (!total) {
    out += '<div class="sm muted" style="padding:12px 14px">' + TUESDAY_JOBS.map(function (j) { return h(j.area.split(' — ')[0]); }).join(' · ') +
      '<div class="xs" style="margin-top:6px">Nothing due this week.' +
      '</div></div>';
  } else if (scope) {
    out += '<div class="xs muted b" style="padding:10px 14px 4px">' + done + ' of ' + total + ' done · due ' + h(fmtD(rows[0].ts[0].due)) + '</div>' +
      rows[0].ts.map(taskRow).join('');
  } else {
    out += '<div class="xs muted b" style="padding:10px 14px 4px">' + done + ' of ' + total + ' done across ' + rows.length + ' locations</div>' +
      rows.map(function (r) {
        var pct = r.ts.length ? Math.round(r.done / r.ts.length * 100) : 0;
        return '<button class="lrow" style="width:100%" data-a="openLoc" data-x="' + r.L.id + ':clean:tuesday">' +
          '<span class="grow"><span class="t trunc">' + h(r.L.name) + '</span>' +
          '<div class="xs muted" style="margin:3px 0 5px">' + r.done + ' of ' + r.ts.length + ' Tuesday jobs done</div>' + bar(pct) + '</span>' +
          '<span class="chev">›</span></button>';
      }).join('');
  }
  return out + '</div>';
}
function statCard(v, l, c) { return '<div class="stat"><b style="color:' + c + '">' + v + '</b><span>' + l + '</span></div>'; }
function tapStat(v, l, c, act, x) {
  return '<button class="stat" style="border-color:' + (v ? c : 'var(--line)') + ';cursor:pointer" data-a="' + act + '" data-x="' + x + '">' +
    '<b style="color:' + (v ? c : 'var(--mut)') + '">' + v + '</b><span>' + l + '</span></button>';
}
function cityCompare(A, B) {
  var rows = [['Overall score', A.overall, B.overall, '%'], ['Deep cleaning', A.clean, B.clean, '%'],
  ['Labelling', A.label, B.label, '%'], ['Expiry control', A.exp, B.exp, '%'],
  ['Expired items', A.expired, B.expired, ''], ['Expiring ≤7d', A.soon, B.soon, ''],
  ['Pending tasks', A.pending, B.pending, ''], ['Rejected tasks', A.rejected, B.rejected, '']];
  var out = '<div class="row xs b" style="margin-bottom:8px"><div style="width:96px;color:var(--mut)">METRIC</div><div class="grow center">SURAT</div><div class="grow center">AHMEDABAD</div></div>';
  rows.forEach(function (r) {
    var better = r[3] === '%' ? (r[1] > r[2] ? 1 : r[2] > r[1] ? 2 : 0) : (r[1] < r[2] ? 1 : r[2] < r[1] ? 2 : 0);
    out += '<div class="row" style="padding:7px 0;border-top:1px solid var(--line)">' +
      '<div class="sm" style="width:96px">' + r[0] + '</div>' +
      '<div class="grow center b" style="color:' + (better === 1 ? 'var(--grn)' : 'var(--ink)') + '">' + r[1] + r[3] + '</div>' +
      '<div class="grow center b" style="color:' + (better === 2 ? 'var(--grn)' : 'var(--ink)') + '">' + r[2] + r[3] + '</div></div>';
  });
  return out;
}
function pendingApprovals() {
  var wk = S.week, out = [];
  visibleLocations().forEach(function (L) {
    tasksFor(L.id, wk).forEach(function (t) { if (t.status === 'completed' && !t.approved) out.push(t); });
  });
  return out;
}

var _scanStream = null, _scanTimer = null;
function stopScan() {
  if (_scanTimer) { clearInterval(_scanTimer); _scanTimer = null; }
  if (_scanStream) { _scanStream.getTracks().forEach(function (t) { t.stop(); }); _scanStream = null; }
}
function startScan() {
  var msg = document.getElementById('scanmsg'), vid = document.getElementById('scanvid');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.textContent = 'Camera not available on this device.'; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
    _scanStream = s; vid.srcObject = s; vid.play();
    if (!('BarcodeDetector' in window)) { msg.textContent = 'Point at the label QR. (No decoder in this browser — type the code below.)'; return; }
    msg.textContent = 'Point at the label QR…';
    var det = new window.BarcodeDetector({ formats: ['qr_code'] });
    _scanTimer = setInterval(function () {
      det.detect(vid).then(function (codes) {
        if (codes && codes.length) { stopScan(); handleScan(codes[0].rawValue); }
      }).catch(function () { });
    }, 400);
  }).catch(function () { msg.textContent = 'Camera permission denied. Type the label code below.'; });
}
/* Product ids used to be kitchen code + a count of products on that phone,
   so two phones could make the same id and one product would overwrite the
   other. Now: kitchen code + time + random, unique across phones and still
   short enough to type from a label (e.g. P-CPP-MF3K9Q-7T2). */
function newProductId(loc) {
  var code = (locById(loc) || {}).code || 'X';
  var rnd = '';
  try { var b = new Uint8Array(3); crypto.getRandomValues(b); rnd = Array.prototype.map.call(b, function (x) { return (x % 36).toString(36); }).join(''); }
  catch (e) { rnd = Math.random().toString(36).slice(2, 5); }
  var id;
  do { id = ('P-' + code + '-' + Date.now().toString(36) + '-' + rnd).toUpperCase(); rnd = Math.random().toString(36).slice(2, 5); }
  while (DB.products.some(function (p) { return p.id === id; }));
  return id;
}

/* Reads whatever a label QR holds: the app link (.../#p=ID, what labels
   print today), the offline form (BOOKENDS|ID|name|EXP:date), the older
   BK|x|ID form, or a code typed by hand. */
function handleScan(text) {
  var id = null, raw = String(text || '').trim(), m;
  if ((m = raw.match(/#p=([A-Za-z0-9-]+)/))) id = m[1];
  else if (raw.indexOf('BOOKENDS|') === 0) id = raw.split('|')[1];
  else if (raw.indexOf('BK|') === 0) id = raw.split('|')[2];
  else id = raw;
  id = String(id || '').trim().toUpperCase();
  var p = DB.products.filter(function (x) { return x.id === id; })[0];
  closeSheet();
  if (p) { productSheet(p.id); toast('Scanned ' + p.name); }
  else toast('No product found for ' + id);
}

function multiScore(loc, weeks) {

function cityAvg(city, weeks) {
  var ls = LOCATIONS.filter(function (l) { return l.city === city; });
  var a = { clean: 0, exp: 0, label: 0, overall: 0, expired: 0, soon: 0, pending: 0, rejected: 0 };
  ls.forEach(function (L) {
    var m = multiScore(L.id, weeks), s = scoreFor(L.id, weeks[0]);
    a.clean += m.clean; a.exp += m.exp; a.label += m.label; a.overall += m.overall;
    a.expired += s.exp.expired; a.soon += s.exp.soon; a.pending += s.clean.pending; a.rejected += s.clean.rejected;
  });

}
/* monthly jobs belong to several weeks, so de-duplicate by task id */

  var seen = {}, out = [];
  weeks.forEach(function (w) {

  });
  return out;
}

      if (t.status === 'rejected') v.clean.push({ loc: L.id, t: t.area, d: 'Rejected: ' + (t.reject || '—'), id: t.id });
      else if (t.status === 'pending' && daysBetween(td, t.due) < 0) v.clean.push({ loc: L.id, t: t.area, d: 'Overdue since ' + fmtD(t.due), id: t.id });
      else if (t.status !== 'pending' && !t.before && !t.after) v.clean.push({ loc: L.id, t: t.area, d: 'Photo evidence missing', id: t.id });
    });
    productsFor(L.id).forEach(function (p) {
      var st = expiryState(p.expiry);
      if (st.k === 'expired') v.exp.push({ loc: L.id, t: p.name, d: 'Expired ' + fmtD(p.expiry) + ' · batch ' + p.batch, id: p.id, prod: 1 });
      else if (st.k === 'soon') v.exp.push({ loc: L.id, t: p.name, d: 'Use by ' + fmtD(p.expiry) + ' (' + st.days + 'd)', id: p.id, prod: 1 });
      if (!p.labelled) v.lab.push({ loc: L.id, t: p.name, d: 'No label · batch ' + p.batch, id: p.id, prod: 1 });
    });
  });
  return v;
}
function vioBlock(title, list) {
  if (!list.length) return '<div class="sec-t">' + title + '</div><div class="card sm muted center">None recorded ✓</div>';
  return '<div class="sec-t">' + title + ' (' + list.length + ')</div><div class="card pad0">' +
    list.slice(0, 12).map(function (x) {
      return '<button class="lrow" data-a="' + (x.prod ? 'product' : 'task') + '" data-x="' + x.id + '"><span class="grow">' +
        '<span class="t sm trunc">' + h(x.t) + '</span><div class="xs muted">' + h(lname(x.loc)) + ' · ' + h(x.d) + '</div></span><span class="chev">›</span></button>';
    }).join('') + (list.length > 12 ? '<div class="xs muted center" style="padding:9px">+' + (list.length - 12) + ' more in the exported report</div>' : '') + '</div>';
}
function staffStats(scope, weeks) {
  var m = {};
  scope.forEach(function (L) {
    uniqueTasks(L.id, weeks).forEach(function (t) {
      var k = t.completedBy || t.assigned;
      m[k] = m[k] || { name: uname(k), loc: L.id, total: 0, ok: 0 };
      m[k].total++; if (t.status === 'completed' && t.approved) m[k].ok++;
    });
  });
  return Object.keys(m).map(function (k) {
    var r = m[k]; r.pct = Math.round((r.ok / (r.total || 1)) * 100); return r;
  }).sort(function (a, b) { return b.pct - a.pct; });
}
function photoEvidence(scope, weeks) {
  var out = [];
  scope.forEach(function (L) { uniqueTasks(L.id, weeks).forEach(function (t) { if (t.before || t.after) out.push(t); }); });
  return out;
}
function csvExport() {
  var weeks = S.repRange === 'week' ? [S.week] : recentWeeks(4), scope = visibleLocations();
  var rows = [['Location', 'City', 'Week', 'Month', 'Cleaning %', 'Weekly jobs %', 'Monthly jobs %', 'Labelling %', 'Expiry %', 'Overall', 'Expired', 'Expiring7d', 'Pending', 'Rejected', 'MissingPhotos']];
  scope.forEach(function (L) {
    weeks.forEach(function (w) {
      var c = cleaningStats(L.id, w), e = expiryStats(L.id);
      rows.push([L.name, L.city, w, monthOfWeek(w), c.pct, cleaningStats(L.id, w, 'W').pct, cleaningStats(L.id, w, 'M').pct,
        e.labelPct, e.score, Math.round(0.4 * c.pct + 0.35 * e.score + 0.25 * e.labelPct),
        e.expired, e.soon, c.pending, c.rejected, c.noPhoto]);
    });
  });
  var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'bookends-compliance-' + ymd(today()) + '.csv';
  a.click();
  toast('CSV exported');
}

/* ---------------- ADMIN ---------------- */
/* The people list comes from GET /api/admin/users rather than the local
   roster, because it shows the login bookkeeping the roster deliberately
   leaves out: first-login status, last sign-in and account age (req 6).
   The sheet opens immediately and fills in when the request lands. */
function usersSheet() {
  openSheet('People, roles & passwords',
    '<div class="card center sm muted" id="u_loading">Loading accounts…</div>');

  Api.get('/api/admin/users').then(function (data) {
    renderUsersSheet(data.users || []);
  }, function (err) {
    var el = document.getElementById('u_loading');
    if (el) {
      el.className = 'card sm';
      el.style.background = '#fdecea';
      el.innerHTML = '<b>' + h(err.message || 'Could not load the account list') + '</b>';
    }
  });
}

function renderUsersSheet(users) {
  var body = '<button class="btn" data-a="addUser" style="margin-bottom:12px">＋ Create a new user</button>' +
    '<div class="card sm muted">Everyone signs in with their own ID and password. Passwords are stored only as an encrypted hash — nobody, including you, can read them back. Change a role from the dropdown, tap 🔑 to reset a forgotten password back to <b>' + h(DEFAULT_PW) + '</b>, or ✕ to remove someone who has left.</div>';

  /* Self sign-ups waiting for a decision come first, since they are the only
     thing on this screen someone is actively waiting on. The admin picks the
     role and kitchen here — the person chose only their username and password. */
  var pending = users.filter(function (u) { return u.pending; });
  if (perm().superadmin && pending.length !== PENDING_SIGNUPS) {
    PENDING_SIGNUPS = pending.length;
    if (S.tab === 'home') render();      /* updates the notice behind the sheet */
  }
  /* Other admins can see that people are waiting, but only the Super Admin
     decides. The server enforces this; the note just says who to ask. */
  if (pending.length && !perm().superadmin) {
    body += '<div class="card sm" style="background:#fff6e5;border-color:#f0dcb0"><b>' + pending.length + ' new sign-up' + (pending.length === 1 ? '' : 's') +
      ' waiting for approval</b><div class="muted" style="margin-top:4px">Only the Super Admin (Husen) can approve or reject them: ' +
      pending.map(function (u) { return h(u.name) + ' (' + h(u.uid) + ')'; }).join(', ') + '.</div></div>';
  }
  if (pending.length && perm().superadmin) {
    body += '<div class="sec-t" style="color:var(--org)">Waiting for approval (' + pending.length + ')</div><div class="card pad0">' +
      pending.map(function (u) {
        return '<div class="lrow" style="flex-wrap:wrap;row-gap:8px">' +
          '<span class="thumb" style="display:grid;place-items:center;font-weight:800;color:var(--org);font-size:13px">' + h(initials(u.name)) + '</span>' +
          '<span class="grow"><span class="t sm">' + h(u.name) + '</span>' +
          '<div class="xs muted">Username <b>' + h(u.uid) + '</b> · signed up ' + h(fmtDT(u.createdAt)) + '</div>' +
          '<div class="xs muted">Says they work at ' + (u.loc ? h(lname(u.loc)) : '—') + '</div></span>' +
          '<select class="inp" id="ap_role_' + h(u.id) + '" style="width:118px;min-height:42px;font-size:12.5px;padding:6px 8px">' +
          assignableRoles().map(function (k) { return '<option value="' + k + '"' + (k === 'staff' ? ' selected' : '') + '>' + ROLES[k].label + '</option>'; }).join('') +
          '</select>' +
          '<select class="inp" id="ap_loc_' + h(u.id) + '" style="width:130px;min-height:42px;font-size:12.5px;padding:6px 8px">' +
          LOCATIONS.map(function (L) { return '<option value="' + L.id + '"' + (L.id === u.loc ? ' selected' : '') + '>' + h(L.name) + '</option>'; }).join('') +
          '</select>' +
          '<button class="iconbtn" style="background:#e3f4ea;color:var(--grn);width:38px;height:38px;font-size:15px" data-a="approveUser" data-x="' + h(u.id) + '" title="Approve">✓</button>' +
          '<button class="iconbtn" style="background:#f6e7e5;color:var(--red);width:38px;height:38px" data-a="rejectUser" data-x="' + h(u.id) + '" data-n="' + h(u.name) + '" title="Reject">✕</button>' +
          '</div>';
      }).join('') + '</div>';
  }

  ['superadmin', 'exec', 'aexec', 'admin', 'hok', 'manager', 'staff', 'auditor'].forEach(function (rk) {
    var us = users.filter(function (u) { return u.role === rk && !u.pending; });
    if (!us.length) return;
    body += '<div class="sec-t">' + ROLES[rk].label + ' (' + us.length + ')</div><div class="card pad0">' +
      us.map(function (u) {

           was the last time, and are they still on the issued password. */
        var loginLine = u.firstLogin
          ? '<div class="xs" style="color:var(--org);font-weight:700">Has never signed in</div>'
          : '<div class="xs muted">Last sign-in ' + h(fmtDT(u.lastLogin)) + ' · ' + u.loginCount + ' total</div>';

        return '<div class="lrow" style="flex-wrap:wrap;row-gap:8px"><span class="thumb" style="display:grid;place-items:center;font-weight:800;color:var(--brand);font-size:13px">' + h(initials(u.name)) + '</span>' +

          loginLine +
          (u.mustChange ? '<div class="xs" style="color:var(--org);font-weight:700">Still on the starting password</div>' : '') + '</span>' +
          /* The Super Admin's row has no controls: its role is fixed on the
             server, and nobody else may reset or remove it. The server
             refuses those anyway; this just avoids offering buttons that fail.
             Husen changes his own password from "Change my password". */
          (ROLES[u.role] && ROLES[u.role].superadmin
            ? '<span class="xs b" style="color:var(--brand);padding:6px 10px">Super Admin</span>'
            : '<select class="inp" style="width:118px;min-height:42px;font-size:12.5px;padding:6px 8px" data-a="chrole" data-x="' + u.id + '">' +

     its scroll position. The stack entry is updated too, so closing a

  var host = document.querySelector('#modal .sheet-b');
  if (!host) return;
  host.innerHTML = body;
  for (var i = SHEET_STACK.length - 1; i >= 0; i--) {
    if (SHEET_STACK[i].title === 'People, roles & passwords') { SHEET_STACK[i].body = body; break; }
  }

/* ---------------- USER MANAGEMENT PANEL (Super Admin only) ----------------
   Everyone's account in one place, plus the two queues only the Super Admin
   acts on: password reset requests and sign-ups waiting for approval.

   Passwords are NOT shown, because they cannot be: only a one-way bcrypt hash
   is stored (requirement 3). What the Super Admin can do instead is set a new
   password for anyone and see it once, which covers the real need — getting
   someone back in. */
function superSheet() {
  openSheet('User Management panel', '<div class="card center sm muted" id="sa_loading">Loading accounts…</div>');
  Api.get('/api/admin/users').then(function (data) {
    renderSuperSheet(data.users || []);
  }, function (err) {
    var el = document.getElementById('sa_loading');
    if (el) { el.className = 'card sm'; el.style.background = '#fdecea'; el.innerHTML = '<b>' + h(err.message || 'Could not load accounts') + '</b>'; }
  });
}

function superStatusLine(u) {
  if (u.pending) return '<span style="color:var(--org);font-weight:700">Waiting for approval</span>';
  if (u.disabled) return '<span style="color:var(--red);font-weight:700">Disabled</span>';
  if (u.firstLogin) return '<span style="color:var(--org);font-weight:700">Has never signed in</span>';
  return 'Last sign-in ' + h(fmtDT(u.lastLogin)) + ' · ' + u.loginCount + ' total';
}

function renderSuperSheet(users) {
  var active = users.filter(function (u) { return !u.pending; });
  var pending = users.filter(function (u) { return u.pending; });
  var resets = users.filter(function (u) { return u.resetRequestedAt && !u.pending; })
    .sort(function (a, b) { return a.resetRequestedAt - b.resetRequestedAt; });

  /* keep the home-screen notice in step with what we just loaded */
  if (pending.length !== PENDING_SIGNUPS || resets.length !== RESET_REQUESTS) {
    PENDING_SIGNUPS = pending.length; RESET_REQUESTS = resets.length;
    tabbar();
    if (S.tab === 'home') render();
  }

  function stat(n, label, warn) {
    return '<div style="flex:1;text-align:center;padding:10px 4px">' +
      '<div class="b" style="font-size:22px' + (warn && n ? ';color:var(--org)' : '') + '">' + n + '</div>' +
      '<div class="xs muted">' + label + '</div></div>';
  }
  var body = '<div class="card" style="display:flex;padding:4px">' +
    stat(active.length, 'Accounts') + stat(pending.length, 'Waiting approval', true) + stat(resets.length, 'Password requests', true) +
    '</div>';

  /* ---- forgot-password requests ---- */
  if (resets.length) {
    body += '<div class="sec-t" style="color:var(--org)">Password reset requests (' + resets.length + ')</div><div class="card pad0">' +
      resets.map(function (u) {
        return '<div class="lrow" style="flex-wrap:wrap;row-gap:8px">' +
          '<span class="thumb" style="display:grid;place-items:center;font-weight:800;color:var(--org);font-size:13px">' + h(initials(u.name)) + '</span>' +
          '<span class="grow"><span class="t sm">' + h(u.name) + '</span>' +
          '<div class="xs muted">Username <b>' + h(u.uid) + '</b> · asked ' + h(fmtDT(u.resetRequestedAt)) + '</div></span>' +
          '<button class="btn" style="width:auto;min-height:40px;padding:6px 12px;font-size:13px" data-a="setPwFor" data-x="' + h(u.id) + '" data-n="' + h(u.name) + '">🔑 Set new password</button>' +
          '<button class="iconbtn" style="background:#eef0ee;color:var(--ink);width:38px;height:38px" data-a="dismissReset" data-x="' + h(u.id) + '" data-n="' + h(u.name) + '" title="Dismiss">✕</button>' +
          '</div>';
      }).join('') + '</div>';
  }

  /* ---- sign-ups: approved on the People screen, where role + kitchen are picked ---- */
  if (pending.length) {
    body += '<div class="sec-t" style="color:var(--org)">Waiting for approval (' + pending.length + ')</div>' +
      '<button class="btn sec" data-a="users" style="margin-bottom:12px">Review ' + pending.length + ' sign-up' + (pending.length === 1 ? '' : 's') + ': ' +
      pending.map(function (u) { return h(u.name); }).join(', ') + ' ›</button>';
  }

  /* ---- every account ---- */
  var order = ['superadmin', 'exec', 'aexec', 'admin', 'hok', 'manager', 'staff', 'auditor'];
  active.sort(function (a, b) { return order.indexOf(a.role) - order.indexOf(b.role) || a.name.localeCompare(b.name); });
  body += '<div class="sec-t">All accounts (' + active.length + ')</div>' +
    '<div class="card sm muted">Passwords are stored only as an encrypted one-way hash, so nobody can read them — including you. ' +
    'To get someone back in, tap <b>🔑 Set new password</b>: you choose a temporary one, see it once, and they pick their own at next sign-in.</div>' +
    '<div class="card pad0">' +
    active.map(function (u) {
      var self = u.id === ME.id;
      return '<div class="lrow" style="flex-wrap:wrap;row-gap:8px">' +
        '<span class="thumb" style="display:grid;place-items:center;font-weight:800;color:var(--brand);font-size:13px">' + h(initials(u.name)) + '</span>' +
        '<span class="grow"><span class="t sm">' + h(u.name) + (self ? ' <span class="xs muted">(you)</span>' : '') + '</span>' +
        '<div class="xs muted">Username <b>' + h(u.uid) + '</b> · ' + h(ROLES[u.role] ? ROLES[u.role].label : u.role) + ' · ' + (u.loc ? h(lname(u.loc)) : 'All 8 locations') + '</div>' +
        '<div class="xs muted">' + superStatusLine(u) + '</div>' +
        '<div class="xs muted">Password: 🔒 encrypted' + (u.mustChange ? ' · <span style="color:var(--org);font-weight:700">temporary, not yet changed</span>' : '') + '</div></span>' +
        (self
          ? '<button class="btn sec" style="width:auto;min-height:40px;padding:6px 12px;font-size:13px" data-a="changePw">🔒 Change mine</button>'
          : '<button class="btn sec" style="width:auto;min-height:40px;padding:6px 12px;font-size:13px" data-a="setPwFor" data-x="' + h(u.id) + '" data-n="' + h(u.name) + '">🔑 Set new password</button>' +
            '<button class="btn sec" style="width:auto;min-height:40px;padding:6px 12px;font-size:13px;color:var(--red)" data-a="superDel" data-x="' + h(u.id) + '" data-n="' + h(u.name) + '" data-l="' + h(u.loc || '') + '">✕ Remove</button>') +
        '</div>';
    }).join('') + '</div>';

  var host = document.querySelector('#modal .sheet-b');
  if (!host) return;
  host.innerHTML = body;
  for (var i = SHEET_STACK.length - 1; i >= 0; i--) {
    if (SHEET_STACK[i].title === 'User Management panel') { SHEET_STACK[i].body = body; break; }
  }
}

/* Sets a new password for one person and shows it once. */
function setPasswordFor(id, name) {
  askText('New password for ' + name,
    'Type a temporary password, or leave it blank for <b>' + h(DEFAULT_PW) + '</b>. ' +
    'They must choose their own the next time they sign in, and are signed out on every device now.',
    '', 'leave blank for ' + DEFAULT_PW, 'Set password', function (value) {

      Api.post('/api/admin/users/' + encodeURIComponent(id) + '/reset-password', pw ? { password: pw } : {})
        .then(function (data) {
          logAct('user', 'New password set for ' + data.user.name, data.user.loc);
          closeSheet();
          openSheet('New password set', '<div class="card center"><div style="font-size:40px">🔑</div>' +
            '<div class="b" style="font-size:18px;margin-top:6px">' + h(data.user.name) + '</div>' +
            '<div class="card" style="margin-top:14px;text-align:left"><div class="xs muted b">USERNAME</div><div class="b" style="font-size:20px">' + h(data.user.uid) + '</div>' +
            '<div class="xs muted b" style="margin-top:10px">TEMPORARY PASSWORD</div><div class="b" style="font-size:20px">' + h(data.password) + '</div></div>' +
            '<div class="sm muted">Give these to ' + h(data.user.name.split(' ')[0]) + ' now — this is the only time the password is shown. ' +
            'They will be asked to choose their own when they sign in.</div></div>' +
            '<button class="btn" data-a="superDash">Back to User Management</button>');
        }, function (err) { toast(err.message || 'Could not set the password'); });
    });
}

var NEWU_ERR = '';
function addUserSheet() {
  openSheet('Create a new user',
    '<div class="card">' +
    '<label class="f"><span>Full name</span><input class="inp" id="u_name" placeholder="e.g. Suresh" autocomplete="off"></label>' +

    '<label class="f"><span>Role</span><select class="inp" id="u_role">' +
    assignableRoles().map(function (k) { return '<option value="' + k + '"' + (k === 'staff' ? ' selected' : '') + '>' + ROLES[k].label + '</option>'; }).join('') +
    '</select></label>' +
    '<label class="f"><span>Location</span><select class="inp" id="u_loc">' +
    LOCATIONS.map(function (L) { return '<option value="' + L.id + '">' + h(L.name) + '</option>'; }).join('') +
    '</select><div class="xs muted" style="margin-top:6px">Ignored for Execution Head, Assistant Execution Head, Admin, Head of Kitchen and Auditor — they see all 8 locations.</div></label>' +
    /* Requirement 1: the admin sets the login ID AND the starting password.
       Left blank it falls back to the shared starting password, which is how
       the form behaved before. Either way the person is asked to choose their
       own on first sign-in, and only the bcrypt hash is ever stored. */
    '<label class="f"><span>Initial password</span><input class="inp" id="u_pw" type="text" placeholder="leave blank for ' + h(DEFAULT_PW) + '" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">' +
    '<div class="xs muted" style="margin-top:6px">At least ' + MIN_PW_LEN + ' characters. Shown in plain text so you can read it out — it is stored only as an encrypted hash and cannot be recovered afterwards.</div></label>' +
    (NEWU_ERR ? '<div class="card" style="background:#fdecea;border-color:#f6c9c4;margin:0 0 12px"><b class="sm">' + h(NEWU_ERR) + '</b></div>' : '') +
    '</div>' +
    '<div class="card sm muted">They must choose their own password the first time they sign in, whichever one you set here.</div>' +

  var n = document.getElementById('u_name');

    if (!uidF.dataset.touched) uidF.value = makeUid(n.value || '', DB.users);

/* Creates the account through the admin API (req 1).

   The password is generated and hashed on the server; this code never holds
   one except for the single plaintext the server returns so the admin can
   read it out to the new user. Uniqueness of the login ID is decided by the
   database, not by this device's possibly stale local copy. */
var NEWU_BUSY = false;
function saveUser() {
  if (NEWU_BUSY) return;

  var name = document.getElementById('u_name').value.trim();
  var uid = (document.getElementById('u_uid').value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  var role = document.getElementById('u_role').value;
  var loc = document.getElementById('u_loc').value;
  /* Not trimmed: a space can legitimately be part of a password. */
  var pw = document.getElementById('u_pw').value || '';

  if (!name) { NEWU_ERR = 'Enter a name'; closeSheet(); addUserSheet(); return; }
  /* Caught here so the admin is not left waiting on a round trip for an
     obvious mistake. The server re-checks it either way. */
  if (pw && pw.length < MIN_PW_LEN) {
    NEWU_ERR = 'The initial password must be at least ' + MIN_PW_LEN + ' characters, or leave it blank for ' + DEFAULT_PW;
    closeSheet(); addUserSheet(); return;
  }

  NEWU_BUSY = true;
  var btn = document.querySelector('[data-a="saveUser"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }

  Api.post('/api/admin/users', {
    name: name,
    uid: uid || undefined,        /* omitted -> the server derives it */
    role: role,
    loc: ROLES[role].all ? null : loc,
    password: pw || undefined     /* omitted -> the server uses DEFAULT_PASSWORD */
  }).then(function (data) {
    NEWU_BUSY = false;
    NEWU_ERR = '';
    var u = data.user;
    logAct('user', 'Created user ' + u.name + ' (' + u.uid + ') as ' + ROLES[u.role].label, u.loc);

    /* Refresh the roster so the new person is immediately assignable. */
    Auth.loadRoster().catch(function () { });

    closeSheet();

/* ---------------- PHOTOS (local first, cloud in the background) ---------------- */
function setPhoto(t, which, dataUrl) {
  t[which] = dataUrl; save('tasks', t);
  logAct('photo', 'photo added: ' + t.area, t.loc);
  taskSheet(t.id); toast('Photo saved');
  if (Cloud.on()) Cloud.uploadPhoto(dataUrl, t.loc, function (err, url) {
    if (!err && url && url !== dataUrl && t[which] === dataUrl) { t[which] = url; save('tasks', t); }
  });
}
function uploadProductPhoto(p) {
  if (!Cloud.on() || !p.photo || p.photo.indexOf('data:') !== 0) return;
  var sent = p.photo;
  Cloud.uploadPhoto(sent, p.loc, function (err, url) {
    if (!err && url && url.indexOf('http') === 0 && p.photo === sent) { p.photo = url; save('products', p); }
  });
}
/* Photos taken with no connection stay on the device as data: URLs. Once
   sync is working again, upload them one at a time and swap in the URL.
   Only this kitchen's records (or all, for head office) — the same ones the
   server would let this account change. */
var PHOTO_RETRY_BUSY = false;
function retryPhotoUploads() {
  if (PHOTO_RETRY_BUSY || !Cloud.on() || perm().readonly) return;
  var mine = function (o) { return perm().all || o.loc === ME.loc; };
  var queue = [];
  DB.tasks.forEach(function (t) {
    if (!mine(t)) return;
    ['before', 'after'].forEach(function (w) { if (t[w] && t[w].indexOf('data:') === 0) queue.push({ o: t, kind: 'tasks', f: w }); });
  });
  DB.products.forEach(function (p) { if (mine(p) && p.photo && p.photo.indexOf('data:') === 0) queue.push({ o: p, kind: 'products', f: 'photo' }); });
  if (!queue.length) return;
  PHOTO_RETRY_BUSY = true;
  (function next() {
    var q = queue.shift();
    if (!q) { PHOTO_RETRY_BUSY = false; return; }
    var sent = q.o[q.f];
    Cloud.uploadPhoto(sent, q.o.loc, function (err, url) {
      if (err) { PHOTO_RETRY_BUSY = false; return; }      /* try again after the next sync */
      if (q.o[q.f] === sent) { q.o[q.f] = url; save(q.kind, q.o); }
      next();
    });
  })();
}

/* ---------------- APP SHELL: install, offline, back button, updates ---------------- */
var deferredInstall = null;
function initPWA() {
  /* offline / online banner */
  function net() {
    var b = document.getElementById('netbar');
    if (navigator.onLine) { if (b) b.remove(); }
    else if (!b) {
      var d = document.createElement('div');
      d.id = 'netbar'; d.className = 'netbar';
      d.textContent = 'No internet — your work is being saved and will upload automatically';
      document.body.appendChild(d);
    }
  }
  /* Back online: if the app opened offline there is no session yet, so get
     one from the refresh cookie first, then catch up. */
  window.addEventListener('online', function () {
    net();
    if (Cloud.on()) { Cloud.sync(retryPhotoUploads); return; }
    if (ME && !Api.token) {
      Api.refresh().then(function () { Auth.offline = false; startSync(); }, function () { });
    }
  });
  window.addEventListener('offline', net);
  net();

  /* add to home screen */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });

  /* android/desktop back button closes the open sheet instead of leaving the app */
  window.addEventListener('popstate', function () {
    if ($('#modal').innerHTML) { stopScan(); closeSheet(); history.pushState({ app: 1 }, ''); }
  });
  history.pushState({ app: 1 }, '');

  /* refresh data when the app comes back to the foreground */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Cloud.on()) Cloud.sync(retryPhotoUploads);
  });
}
function isStandalone() {

    return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

}
