<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b3d2e'/%3E%3Cpath d='M18 33l9 10 19-22' stroke='%23fff' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Bookends Kitchen Compliance</title>
<style>
:root{
  --brand:#0b3d2e; --brand2:#12674c; --accent:#e8b33a;
  --bg:#f4f5f3; --card:#ffffff; --line:#e2e5e0; --ink:#12181c; --mut:#6a7480;
  --red:#d63b30; --org:#e07b1e; --yel:#d6b400; --grn:#1e8e5a; --blue:#2563c9;
  --r:16px; --sh:0 1px 2px rgba(16,24,32,.06),0 4px 16px rgba(16,24,32,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:760px;margin:0 auto;padding:0 0 96px;min-height:100vh}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:50;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 12px}
.hdr-row{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.3px;flex:1;line-height:1.15}
.hdr h1 small{display:block;font-size:11px;font-weight:500;opacity:.72;letter-spacing:.6px;text-transform:uppercase}
.iconbtn{background:rgba(255,255,255,.14);border:0;color:#fff;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:19px;cursor:pointer}
.iconbtn:active{background:rgba(255,255,255,.28)}
.badge{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;font-weight:800;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--brand)}
.rel{position:relative}
.locbar{margin-top:10px}
.locbar select{width:100%;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);color:#fff;padding:11px 12px;border-radius:12px;font-size:15px;font-weight:600;appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center}
.locbar select option{color:#12181c}

/* ---------- layout ---------- */
.wrap{padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card.pad0{padding:0;overflow:hidden}
.sec-t{font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--mut);margin:18px 4px 8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.muted{color:var(--mut)}
.sm{font-size:13px}
.xs{font-size:11.5px}
.b{font-weight:700}
.center{text-align:center}
.hide{display:none!important}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:14px;
  background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer;padding:10px 16px;text-align:center}
.btn:active{transform:scale(.985)}
.btn.sec{background:#fff;color:var(--brand);border:1.5px solid var(--line)}
.btn.ok{background:var(--grn)} .btn.no{background:var(--red)} .btn.warn{background:var(--org)}
.btn.sm{min-height:44px;font-size:14px;border-radius:11px;padding:8px 12px;width:auto}
.btn[disabled]{opacity:.45;pointer-events:none}
.btnrow{display:flex;gap:10px}
.btnrow>.btn{flex:1}
.big{display:flex;align-items:center;gap:16px;width:100%;min-height:104px;border:0;border-radius:20px;background:#fff;border:1.5px solid var(--line);
  box-shadow:var(--sh);padding:16px 18px;margin-bottom:14px;text-align:left;cursor:pointer}
.big:active{transform:scale(.985)}
.big .bi{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:32px;flex:none}
.big .bt{font-size:21px;font-weight:800;line-height:1.15;letter-spacing:.2px}
.big .bs{font-size:14px;color:var(--mut);font-weight:600;margin-top:3px}
.big .bn{margin-left:auto;font-size:30px;font-weight:900;line-height:1;flex:none}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .n{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.step.done .n{background:var(--grn)}
.step.todo .n{background:#d3d8d4;color:#fff}
.photo.tall{min-height:170px}
.fab{position:fixed;right:calc(50% - 380px + 16px);bottom:96px;z-index:60;width:auto;min-height:56px;padding:0 22px;border-radius:28px;
  box-shadow:0 8px 24px rgba(11,61,46,.34);display:flex;align-items:center;gap:9px;background:var(--brand);color:#fff;font-weight:700;border:0;font-size:16px;cursor:pointer}
@media(max-width:792px){.fab{right:16px}}

/* ---------- tabbar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
.tabs-in{max-width:760px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font-size:10.5px;font-weight:700;cursor:pointer}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab.on{color:var(--brand)}

/* ---------- pills / status ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.p-red{background:#fdecea;color:#a12a21} .p-org{background:#fdf0e0;color:#a3550f}
.p-yel{background:#fbf6d9;color:#8a7300}
.p-grn{background:#e6f5ee;color:#106041} .p-gry{background:#eef0ee;color:#5c6670}
.p-blu{background:#e8f0fd;color:#1e4fa3}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* ---------- list rows ---------- */
.lrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer;width:100%;border:0;text-align:left}
.lrow:last-child{border-bottom:0}
.lrow:active{background:#f7f8f6}
.lrow .t{font-weight:650;font-size:15px;line-height:1.25}
.thumb{width:46px;height:46px;border-radius:11px;object-fit:cover;background:#eceee9;flex:none}
.chev{color:#c2c8cc;font-size:20px;flex:none}

/* ---------- meters ---------- */
.bar{height:9px;border-radius:6px;background:#e9ebe7;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--grn);transition:width .4s}
.ring{display:block;margin:0 auto}
.ring .tr{stroke:rgba(255,255,255,.2)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1;font-weight:800}
.stat span{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.3px;text-transform:uppercase}

/* ---------- forms ---------- */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:12.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.inp{width:100%;min-height:54px;border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;background:#fff;font-size:16px}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='%236a7480'><path d='M7 10l5 5 5-5z'/></svg>");background-repeat:no-repeat;background-position:right 14px center}
.inp:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(18,103,76,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;color:var(--mut);cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- photo ---------- */
.photo{position:relative;border:2px dashed #cfd5d0;border-radius:14px;background:#fafbfa;min-height:120px;display:grid;place-items:center;text-align:center;padding:10px;cursor:pointer;overflow:hidden}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo .ph-t{font-size:12.5px;font-weight:800;color:var(--mut)}
.photo .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;z-index:2}
.photo .x{position:absolute;right:6px;top:6px;z-index:3;background:rgba(0,0,0,.6);color:#fff;border:0;width:28px;height:28px;border-radius:50%;font-size:15px;cursor:pointer}

/* ---------- sheet / modal ---------- */
.ovl{position:fixed;inset:0;background:rgba(10,16,20,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;animation:up .22s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
@keyframes up{from{transform:translateY(30px)}}
.sheet-h{position:sticky;top:0;background:var(--bg);padding:14px 14px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);z-index:2}
.sheet-h h2{margin:0;font-size:17px;flex:1;font-weight:800;line-height:1.2}
.sheet-b{padding:14px}

/* ---------- label print ---------- */
.lbl{background:#fff;border:2px solid #111;border-radius:8px;padding:12px;display:flex;gap:12px;font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.lbl .qr{width:104px;flex:none}
.lbl .qr svg{width:100%;height:auto;display:block}
.lbl .f{flex:1;min-width:0}
.lbl .nm{font-size:17px;font-weight:900;line-height:1.15;margin-bottom:2px;text-transform:uppercase}
.lbl .kv{font-size:11.5px;line-height:1.5}
.lbl .kv b{display:inline-block;min-width:64px;font-weight:800}
.lbl .exp{margin-top:5px;background:#111;color:#fff;padding:3px 7px;border-radius:5px;font-size:12.5px;font-weight:900;display:inline-block}
.lbl .brand{font-size:9px;letter-spacing:1.6px;font-weight:800;color:#555;margin-top:6px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:9px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- in-app dialogs (never use browser popups) ---------- */
.dlg-ovl{position:fixed;inset:0;background:rgba(10,16,20,.55);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .12s}
.dlg{background:#fff;border-radius:20px;max-width:400px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .18s}
.dlg h3{margin:0 0 6px;font-size:18px;font-weight:800;line-height:1.25}
.dlg p{margin:0 0 16px;font-size:14.5px;color:var(--mut);line-height:1.5}
.dlg .inp{margin-bottom:16px}

/* ---------- printing (no pop-up windows — iOS blocks them) ---------- */
#printarea{display:none}
@media print{
  #app,#tabbar,#modal,#dialog,.netbar,.toast{display:none!important}
  #printarea{display:block!important}
  .lbl-sheet{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
}

/* ---------- handwritten label card ---------- */
.wl{background:#fff;border:3px solid #111;border-radius:14px;padding:16px}
.wl .r{display:flex;align-items:baseline;gap:10px;border-bottom:2px dashed #c8ccc9;padding:10px 0}
.wl .r:last-child{border-bottom:0}
.wl .k{font-size:11px;font-weight:900;letter-spacing:.8px;color:#6a7480;text-transform:uppercase;width:96px;flex:none}
.wl .v{font-size:21px;font-weight:900;line-height:1.15;word-break:break-word}
.wl .v.big{font-size:26px}
.wl .hl{background:#111;color:#fff;padding:2px 8px;border-radius:6px;display:inline-block}

/* ---------- laptop / desktop ---------- */
@media (min-width:900px){
  #app{max-width:none;padding:0 0 40px 232px}
  .hdr{padding-left:22px;padding-right:22px}
  .wrap{padding:22px 26px;max-width:1240px}
  .tabs{left:0;right:auto;top:0;bottom:0;width:232px;border-top:0;border-right:1px solid var(--line);
    padding:0;background:#0b3d2e;flex-direction:column}
  .tabs-in{flex-direction:column;max-width:none;width:232px;padding:18px 12px;gap:4px}
  .tabs-in::before{content:'BOOKENDS';display:block;color:#fff;font-size:13px;font-weight:800;letter-spacing:2px;padding:8px 14px 18px;opacity:.9}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:13px 14px;border-radius:12px;
    font-size:14.5px;color:rgba(255,255,255,.72)}
  .tab svg{width:21px;height:21px}
  .tab.on{background:rgba(255,255,255,.14);color:#fff}
  .tab:hover{background:rgba(255,255,255,.08)}
  .fab{right:34px;bottom:34px}
  .grid2{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(6,1fr)}
  .dash2{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
  .dash2>*{margin-bottom:0}
  .loc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
  .loc-grid .card{margin-bottom:0}
  .sheet{max-width:720px;border-radius:20px;max-height:88vh;align-self:center}
  .ovl{align-items:center}
  .btn:hover{filter:brightness(1.06)}
  .lrow:hover{background:#f7f8f6}
}
@media (min-width:1280px){ .wrap{padding:24px 40px} }
.netbar{position:fixed;left:0;right:0;top:0;z-index:300;background:#8a5a00;color:#fff;font-size:12.5px;font-weight:700;
  text-align:center;padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
.netbar ~ #app .hdr{top:34px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;z-index:200;background:#12181c;color:#fff;padding:13px 20px;border-radius:14px;font-size:14.5px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:88%;text-align:center;animation:up .2s}
.empty{text-align:center;padding:38px 20px;color:var(--mut)}
.empty .ic{font-size:40px;margin-bottom:8px;opacity:.55}

/* ---------- small-phone hardening (≤380px, e.g. iPhone SE, budget Android) ---------- */
@media screen and (max-width:380px){
  html,body{overflow-x:hidden}

  .grid3{grid-template-columns:repeat(2,1fr);gap:8px}
  .grid3>*{min-width:0}

  .stat b{font-size:20px}
  .stat span{font-size:10px}

  .lbl{flex-direction:column}
  .lbl .qr{width:auto;max-width:130px;margin:0 auto}
  .lbl .nm,.lbl .kv{overflow-wrap:break-word;word-break:break-word}

  .wl{padding:12px}
  .wl .r{gap:8px}
  .wl .k{width:72px;font-size:10px}
  .wl .v{font-size:18px}
  .wl .v.big{font-size:22px}

  .big .bt{font-size:17px}
  .big .bs{font-size:12.5px}

  .iconbtn{width:38px;height:38px;font-size:17px}
  .hdr h1{font-size:14px}
  .hdr h1 small{font-size:10px}
}

@media print{
  body{background:#fff}
  .hdr,.tabs,.fab,.noprint,.sheet-h{display:none!important}
  #app{padding:0;max-width:none}
  .ovl{position:static;background:none;display:block}
  .sheet{max-height:none;border-radius:0;box-shadow:none;background:#fff}
  .card{box-shadow:none;break-inside:avoid}
  .print-grid{display:grid;grid-template-columns:1fr 1fr;gap:8mm}
}

<div id="app"><div style="padding:60px 24px;text-align:center;color:#6a7480;font-size:14px">Loading Bookends…</div></div>
<div id="tabbar"></div>
<div id="modal"></div>
<div id="dialog"></div>
<div id="printarea"></div>
<script>
window.onerror = function (msg, src, line) {
  var a = document.getElementById('app');
  if (!a) return;
  a.innerHTML = '<div style="padding:26px;font-family:-apple-system,Segoe UI,Arial,sans-serif">' +
    '<div style="font-size:38px">⚠️</div>' +
    '<h2 style="margin:8px 0 6px;font-size:19px">The app could not start</h2>' +
    '<p style="color:#6a7480;font-size:14px;line-height:1.5">Please close this tab and open the link again. ' +
    'If it keeps happening, send this message to Husen:</p>' +
    '<pre style="background:#f4f5f3;padding:12px;border-radius:10px;font-size:11px;white-space:pre-wrap;overflow:auto">' +
    String(msg) + '\nline ' + line + '</pre></div>';
};

/* QR */
/* ---------- Offline QR encoder (byte mode, versions 1-10, ECC level M) ---------- */
var QR = (function () {
  // total codewords per version (1..10)
  var TOTAL_CW = [0, 26, 44, 70, 100, 134, 172, 196, 242, 292, 346];
  // [ecPerBlock, blocks1, data1, blocks2, data2] for ECC level M
  var RS_M = [
    null,
    [10, 1, 16, 0, 0],
    [16, 1, 28, 0, 0],
    [26, 1, 44, 0, 0],
    [18, 2, 32, 0, 0],
    [24, 2, 43, 0, 0],
    [16, 4, 27, 0, 0],
    [18, 4, 31, 0, 0],
    [22, 2, 38, 2, 39],
    [22, 3, 36, 2, 37],
    [26, 4, 43, 1, 44]
  ];
  var ALIGN = [
    [], [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34],
    [6, 22, 38], [6, 24, 42], [6, 26, 46], [6, 28, 50]
  ];

  // Galois field tables
  var EXP = new Array(512), LOG = new Array(256);
  (function () {
    var x = 1;
    for (var i = 0; i < 255; i++) {
      EXP[i] = x; LOG[x] = i;
      x <<= 1;
      if (x & 0x100) x ^= 0x11d;
    }
    for (var j = 255; j < 512; j++) EXP[j] = EXP[j - 255];
  })();
  function gmul(a, b) { if (a === 0 || b === 0) return 0; return EXP[LOG[a] + LOG[b]]; }

  function rsGenPoly(n) {
    var poly = [1];
    for (var i = 0; i < n; i++) {
      var next = new Array(poly.length + 1).fill(0);
      for (var j = 0; j < poly.length; j++) {
        next[j] ^= poly[j];
        next[j + 1] ^= gmul(poly[j], EXP[i]);
      }
      poly = next;
    }
    return poly;
  }

  function rsEncode(data, ecLen) {
    var gen = rsGenPoly(ecLen);
    var res = new Array(ecLen).fill(0);
    for (var i = 0; i < data.length; i++) {
      var factor = data[i] ^ res[0];
      res.shift(); res.push(0);
      if (factor !== 0) {
        for (var j = 0; j < ecLen; j++) res[j] ^= gmul(gen[j + 1], factor);
      }
    }
    return res;
  }

  function bchFormat(fmt) {
    var d = fmt << 10;
    for (var i = 4; i >= 0; i--) if (d & (1 << (i + 10))) d ^= 0x537 << i;
    return ((fmt << 10) | d) ^ 0x5412;
  }
  function bchVersion(ver) {
    var d = ver << 12;
    for (var i = 5; i >= 0; i--) if (d & (1 << (i + 12))) d ^= 0x1f25 << i;
    return (ver << 12) | d;
  }

  function utf8Bytes(str) {
    var out = [], i, c;
    for (i = 0; i < str.length; i++) {
      c = str.charCodeAt(i);
      if (c < 0x80) out.push(c);
      else if (c < 0x800) { out.push(0xc0 | (c >> 6), 0x80 | (c & 63)); }
      else if (c < 0xd800 || c >= 0xe000) { out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63)); }

        var cp = 0x10000 + (((c & 0x3ff) << 10) | (str.charCodeAt(i) & 0x3ff));
        out.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
      }
    }
    return out;
  }

  function pickVersion(byteLen) {
    for (var v = 1; v <= 10; v++) {
      var r = RS_M[v];
      var dataCw = r[1] * r[2] + r[3] * r[4];
      var ccBits = v < 10 ? 8 : 16;
      var need = 4 + ccBits + byteLen * 8;
      if (need <= dataCw * 8) return v;
    }
    return -1;
  }

  function buildCodewords(bytes, ver) {
    var r = RS_M[ver];
    var dataCw = r[1] * r[2] + r[3] * r[4];
    var ccBits = ver < 10 ? 8 : 16;
    var bits = [];
    function put(val, len) { for (var i = len - 1; i >= 0; i--) bits.push((val >> i) & 1); }
    put(4, 4);
    put(bytes.length, ccBits);
    for (var i = 0; i < bytes.length; i++) put(bytes[i], 8);
    var cap = dataCw * 8;
    var term = Math.min(4, cap - bits.length);
    put(0, term);
    while (bits.length % 8 !== 0) bits.push(0);
    var cws = [];
    for (var b = 0; b < bits.length; b += 8) {
      var v = 0; for (var k = 0; k < 8; k++) v = (v << 1) | bits[b + k];
      cws.push(v);
    }
    var pad = [0xec, 0x11], pi = 0;
    while (cws.length < dataCw) { cws.push(pad[pi % 2]); pi++; }

    // split into blocks
    var blocks = [], ecBlocks = [], pos = 0, n;
    for (n = 0; n < r[1]; n++) { blocks.push(cws.slice(pos, pos + r[2])); pos += r[2]; }
    for (n = 0; n < r[3]; n++) { blocks.push(cws.slice(pos, pos + r[4])); pos += r[4]; }
    for (n = 0; n < blocks.length; n++) ecBlocks.push(rsEncode(blocks[n], r[0]));

    var out = [], maxD = Math.max(r[2], r[4] || 0), c;
    for (c = 0; c < maxD; c++) for (n = 0; n < blocks.length; n++) if (c < blocks[n].length) out.push(blocks[n][c]);
    for (c = 0; c < r[0]; c++) for (n = 0; n < ecBlocks.length; n++) out.push(ecBlocks[n][c]);

  }

  function makeMatrix(ver) {
    var size = ver * 4 + 17;
    var m = [], res = [], i, j;
    for (i = 0; i < size; i++) { m.push(new Array(size).fill(null)); res.push(new Array(size).fill(false)); }

    function finder(r0, c0) {
      for (var dr = -1; dr <= 7; dr++) for (var dc = -1; dc <= 7; dc++) {
        var r = r0 + dr, c = c0 + dc;
        if (r < 0 || c < 0 || r >= size || c >= size) continue;
        var inRing = (dr >= 0 && dr <= 6 && dc >= 0 && dc <= 6);
        var dark = false;
        if (inRing) {
          dark = (dr === 0 || dr === 6 || dc === 0 || dc === 6) ||
                 (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        }
        m[r][c] = dark; res[r][c] = true;
      }
    }
    finder(0, 0); finder(0, size - 7); finder(size - 7, 0);

    // timing
    for (i = 8; i < size - 8; i++) {
      m[6][i] = (i % 2 === 0); res[6][i] = true;
      m[i][6] = (i % 2 === 0); res[i][6] = true;
    }
    // alignment
    var ap = ALIGN[ver];
    for (i = 0; i < ap.length; i++) for (j = 0; j < ap.length; j++) {

      if (!res[i][8]) { res[i][8] = true; m[i][8] = false; }
    }
    for (i = 0; i < 8; i++) {
      res[8][size - 1 - i] = true; m[8][size - 1 - i] = false;
      res[size - 1 - i][8] = true; m[size - 1 - i][8] = false;

  function placeData(mm, cws) {
    var m = mm.m, res = mm.res, size = mm.size;
    var bitIdx = 0, total = cws.length * 8;
    function nextBit() {
      if (bitIdx >= total) return false;
      var b = (cws[bitIdx >> 3] >> (7 - (bitIdx & 7))) & 1;

    var up = true;
    for (var col = size - 1; col > 0; col -= 2) {
      if (col === 6) col--;

      up = !up;
    }

  function applyMask(m, res, size, mask) {
    var out = [];
    for (var r = 0; r < size; r++) {
      out.push([]);
      for (var c = 0; c < size; c++) {
        var v = m[r][c];

            case 0: f = (r + c) % 2 === 0; break;
            case 1: f = r % 2 === 0; break;
            case 2: f = c % 3 === 0; break;
            case 3: f = (r + c) % 3 === 0; break;
            case 4: f = (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0; break;
            case 5: f = ((r * c) % 2) + ((r * c) % 3) === 0; break;
            case 6: f = (((r * c) % 2) + ((r * c) % 3)) % 2 === 0; break;

  function drawFormat(g, size, mask) {
    var fmt = bchFormat((0 << 3) | mask); // 00 = ECC level M

      else g[size - 15 + i][8] = bit;

  function penalty(g, size) {
    var p = 0, r, c, i, run, prev;

      run = 1; prev = g[r][0];
      for (c = 1; c < size; c++) {
        if (g[r][c] === prev) run++;

      if (run >= 5) p += 3 + (run - 5);

      run = 1; prev = g[0][c];
      for (r = 1; r < size; r++) {
        if (g[r][c] === prev) run++;
        else { if (run >= 5) p += 3 + (run - 5); run = 1; prev = g[r][c]; }

      if (run >= 5) p += 3 + (run - 5);

/* =====================================================================
   CLOUD SYNC — shares one live copy of the data across every device.
   Backed by Supabase (PostgREST + Storage). Works offline and catches up.
   ---------------------------------------------------------------------
   To switch it on, either paste your two values below, or use
   Profile → Cloud sync inside the app.
   ===================================================================== */
var CLOUD_BAKED = {
  url: '',   // e.g. https://abcdefghijkl.supabase.co
  key: ''    // the "anon / publishable" key — never the service_role key
};
var CLOUD_KEY = 'bookends.cloud.v1';
var TABLES = { users: 'bk_users', tasks: 'bk_tasks', products: 'bk_products' };
var BUCKET = 'bk-photos';

var Cloud = {
  cfg: { url: '', key: '' },
  state: 'off',          // off | syncing | ok | error
  lastPull: '1970-01-01T00:00:00Z',
  dirty: { users: {}, tasks: {}, products: {} },
  timer: null, poll: null, err: '',

  init: function () {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(CLOUD_KEY)); } catch (e) { }
    var c = saved && saved.url ? saved : CLOUD_BAKED;
    this.cfg = { url: String(c.url || '').replace(/\/+$/, ''), key: String(c.key || '') };
    if (saved && saved.lastPull) this.lastPull = saved.lastPull;
    if (this.on()) { this.state = 'syncing'; this.sync(true); this.startPolling(); }
  },
  on: function () { return !!(this.cfg.url && this.cfg.key); },
  saveCfg: function () {
    try { localStorage.setItem(CLOUD_KEY, JSON.stringify({ url: this.cfg.url, key: this.cfg.key, lastPull: this.lastPull })); } catch (e) { }
  },
  connect: function (url, key, cb) {
    this.cfg = { url: String(url || '').trim().replace(/\/+$/, ''), key: String(key || '').trim() };
    this.lastPull = '1970-01-01T00:00:00Z';
    var self = this;
    this.request('GET', '/rest/v1/' + TABLES.users + '?select=id&limit=1', null, function (err) {
      if (err) { self.state = 'error'; self.err = err; cb(err); return; }
      self.saveCfg();
      /* Pull first. Whatever is already in the cloud is the truth — this device
         must not overwrite it with its own older copy. Only records the cloud
         has never seen are uploaded. */
      self.seen = { users: {}, tasks: {}, products: {} };
      self.force = true;   /* on first connect the cloud always wins */
      self.sync(true, function (e2) {
        self.force = false;
        if (e2) { cb(e2); return; }
        self.markMissing();
        self.push(function () { self.startPolling(); cb(null); });
      });
    });
  },
  disconnect: function () {
    this.cfg = { url: '', key: '' }; this.state = 'off';
    try { localStorage.removeItem(CLOUD_KEY); } catch (e) { }
    if (this.poll) { clearInterval(this.poll); this.poll = null; }
  },
  startPolling: function () {

  },

  headers: function (extra) {
    var hh = { apikey: this.cfg.key, Authorization: 'Bearer ' + this.cfg.key };
    for (var k in (extra || {})) hh[k] = extra[k];
    return hh;
  },
  request: function (method, path, body, cb) {
    if (!this.on()) { cb('Cloud not connected'); return; }

    if (body) { opts.body = JSON.stringify(body); opts.headers.Prefer = 'resolution=merge-duplicates,return=minimal'; }
    fetch(this.cfg.url + path, opts).then(function (r) {
      if (!r.ok) { return r.text().then(function (t) { cb('HTTP ' + r.status + ' — ' + (t || r.statusText).slice(0, 160)); }); }
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') > -1) r.json().then(function (j) { cb(null, j); }); else cb(null, null);

  },

  /* ---------- marking changes ---------- */
  touch: function (kind, obj) {
    if (!obj) return;
    obj._u = Date.now();
    this.dirty[kind][obj.id] = 1;
    this.schedule();
  },
  seen: { users: {}, tasks: {}, products: {} },
  force: false,
  markAll: function () {
    var self = this;
    DB.users.forEach(function (u) { if (!u._u) u._u = Date.now(); self.dirty.users[u.id] = 1; });
    DB.tasks.forEach(function (t) { if (!t._u) t._u = Date.now(); self.dirty.tasks[t.id] = 1; });
    DB.products.forEach(function (p) { if (!p._u) p._u = Date.now(); self.dirty.products[p.id] = 1; });
  },
  /* upload only what the cloud has never seen */
  markMissing: function () {
    var self = this;
    [['users', DB.users], ['tasks', DB.tasks], ['products', DB.products]].forEach(function (pair) {
      pair[1].forEach(function (o) {
        if (self.seen[pair[0]][o.id]) return;
        if (!o._u) o._u = Date.now();
        self.dirty[pair[0]][o.id] = 1;
      });
    });
    saveLocal();
  },
  pendingCount: function () {
    var n = 0, self = this;
    ['users', 'tasks', 'products'].forEach(function (k) { n += Object.keys(self.dirty[k]).length; });
    return n;
  },
  schedule: function () {
    if (!this.on()) return;
    var self = this;
    if (this.timer) clearTimeout(this.timer);
    this.timer = setTimeout(function () { self.push(); }, 900);
  },

  /* ---------- push ---------- */
  push: function (cb) {
    if (!this.on()) { if (cb) cb('off'); return; }
    var self = this, kinds = ['users', 'tasks', 'products'], i = 0;
    this.setState('syncing');
    function next() {
      if (i >= kinds.length) { self.setState('ok'); if (cb) cb(null); return; }
      var kind = kinds[i++], ids = Object.keys(self.dirty[kind]);
      if (!ids.length) { next(); return; }
      var src = kind === 'users' ? DB.users : kind === 'tasks' ? DB.tasks : DB.products;
      var rows = [];
      ids.forEach(function (id) {
        var o = src.filter(function (x) { return x.id === id; })[0];
        if (o) rows.push({ id: o.id, loc: o.loc || null, updated_at: new Date(o._u || Date.now()).toISOString(), data: o });
      });
      if (!rows.length) { ids.forEach(function (id) { delete self.dirty[kind][id]; }); next(); return; }
      /* chunk so a bad connection can still get through */
      var chunks = [], size = 60;
      for (var c = 0; c < rows.length; c += size) chunks.push(rows.slice(c, c + size));
      var ci = 0;
      (function pushChunk() {
        if (ci >= chunks.length) { ids.forEach(function (id) { delete self.dirty[kind][id]; }); next(); return; }
        var chunk = chunks[ci++];
        self.request('POST', '/rest/v1/' + TABLES[kind] + '?on_conflict=id', chunk, function (err) {
          if (err) { self.setState('error', err); if (cb) cb(err); return; }
          pushChunk();
        });
      })();
    }
    next();
  },

  /* ---------- pull + merge ---------- */
  sync: function (full, cb) {

    var stamp = new Date().toISOString();

        self.lastPull = stamp; self.saveCfg();
        self.push(function () {
          if (changed) { saveLocal(); if (typeof render === 'function' && ME) render(); }
          if (cb) cb(null);
        });
        return;
      }
      var kind = kinds[i++];
      self.request('GET', '/rest/v1/' + TABLES[kind] + '?select=id,updated_at,data&updated_at=gt.' + encodeURIComponent(since) + '&limit=5000', null, function (err, rows) {
        if (err) { self.setState('error', err); if (cb) cb(err); return; }
        if (self.merge(kind, rows || [])) changed = true;
        next();
      });
    }
    next();
  },
  merge: function (kind, rows) {
    var arr = kind === 'users' ? DB.users : kind === 'tasks' ? DB.tasks : DB.products;
    var idx = {}, changed = false;
    arr.forEach(function (o, n) { idx[o.id] = n; });
    rows.forEach(function (row) {
      var remote = row.data; if (!remote || !remote.id) return;
      this.seen[kind][remote.id] = 1;
      var rt = new Date(row.updated_at).getTime() || remote._u || 0;
      var pos = idx[remote.id];
      if (remote.deleted) {
        if (pos !== undefined) { arr.splice(pos, 1); idx = {}; arr.forEach(function (o, n) { idx[o.id] = n; }); changed = true; }
        return;
      }
      if (pos === undefined) {

      } else {

        if (this.dirty[kind][local.id]) return;

  },

  tombstone: function (kind, obj) {

      body: bin
    }).then(function (r) {

      cb(null, self.cfg.url + '/storage/v1/object/public/' + BUCKET + '/' + path);

  },

  setState: function (s, err) {

  },
  label: function () {

  }
};

/* ---------- camera capture + compress ---------- */
function capture(cb) {
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = function () {
    var f = inp.files && inp.files[0]; if (!f) { inp.remove(); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var max = 640, sc = Math.min(1, max / Math.max(im.width, im.height));
        var c = document.createElement('canvas');
        c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
        var x = c.getContext('2d'); x.drawImage(im, 0, 0, c.width, c.height);
        var stamp = fmtDT(Date.now()) + '  ·  ' + (ME ? initials(ME.name) : '');
        x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(0, c.height - 20, c.width, 20);
        x.fillStyle = '#fff'; x.font = 'bold 11px sans-serif'; x.fillText(stamp, 6, c.height - 6);
        cb(c.toDataURL('image/jpeg', 0.5)); inp.remove();
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  };
  inp.click();
}

function doLogin() {
  var uid = (document.getElementById('l_uid').value || '').trim().toLowerCase();

  if (!uid || !pw) { LOGIN_ERR = 'Enter your ID and password'; renderLogin(); return; }

  ME = u; localStorage.setItem(SESS, u.id);
  S.loc = u.loc || 'ALL'; S.tab = 'home';

}

  var html = header('BOOKENDS KITCHEN COMPLIANCE', ROLES[ME.role].label + ' · ' + (scope ? lname(scope) : 'All locations'));

    '<div style="margin:12px 0 6px">' + ring(overall, 132, 13, true) + '</div>' +

    '</div>';

  /* key numbers */
  var agg = { clean: 0, exp: 0, lab: 0, expired: 0, soon: 0, pend: 0, rej: 0, nop: 0, n: 0 };
  (scope ? [locById(scope)] : visibleLocations()).forEach(function (L) {
    var s = scoreFor(L.id, wk);
    agg.clean += s.clean.pct; agg.exp += s.exp.score; agg.lab += s.exp.labelPct;
    agg.expired += s.exp.expired; agg.soon += s.exp.soon; agg.pend += s.clean.pending;
    agg.rej += s.clean.rejected; agg.nop += s.clean.noPhoto; agg.n++;
  });
  ['clean', 'exp', 'lab'].forEach(function (k) { agg[k] = Math.round(agg[k] / agg.n); });

  html = html.replace('<div class="wrap">', '<div class="wrap"><div class="dash2"><div>');
  html += '</div><div>';
  html += '<div class="grid3" style="margin-bottom:12px">' +
    statCard(agg.clean + '%', 'Cleaning', scoreColor(agg.clean)) +
    statCard(agg.lab + '%', 'Labelling', scoreColor(agg.lab)) +
    statCard(agg.exp + '%', 'Expiry ctrl', scoreColor(agg.exp)) + '</div>';

  html += '<div class="grid3">' +
    tapStat(agg.expired, 'Expired', 'var(--red)', 'goexp', 'expired') +
    tapStat(agg.soon, 'Expiring 7d', 'var(--org)', 'goexp', 'soon') +
    tapStat(agg.pend, 'Pending tasks', 'var(--mut)', 'goclean', 'pending') +
    tapStat(agg.rej, 'Rejected', 'var(--red)', 'goclean', 'rejected') +
    tapStat(agg.nop, 'Missing photos', 'var(--org)', 'goclean', 'nophoto') +
    tapStat(crit, 'Urgent alerts', 'var(--blue)', 'alerts', '') + '</div>';

  html += '</div></div>';
  /* quick actions */
  html += '<div class="sec-t">Quick actions</div>';
  html += '<div class="btnrow" style="margin-bottom:10px">';
  if (!p.readonly) html += '<button class="btn" data-a="tab" data-x="clean">✓ Do a clean</button>' +
    '<button class="btn sec" data-a="addProduct">＋ Add product</button>';
  else html += '<button class="btn sec" data-a="tab" data-x="rep">📄 Open reports</button>';
  html += '</div>';
  html += '<div class="btnrow">' +
    '<button class="btn sec" data-a="scan">⛶ Scan label QR</button>' +
    (p.approve ? '<button class="btn sec" data-a="tab" data-x="clean">☑ Approvals (' + pendingApprovals().length + ')</button>' : '<button class="btn sec" data-a="tab" data-x="lab">🏷 Print label</button>') +
    '</div>';

  /* location league table */
  if (p.all) {
    html += '<div class="sec-t">Locations · this week</div><div class="loc-grid">';
    LOCATIONS.forEach(function (L) {
      var s = scoreFor(L.id, wk);
      html += '<button class="lrow card" style="width:100%" data-a="locdash" data-x="' + L.id + '">' +
        '<span class="thumb" style="display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;background:' + scoreColor(s.overall) + '">' + s.overall + '</span>' +
        '<span class="grow"><span class="t trunc">' + h(L.name) + '</span>' +
        '<div class="xs muted" style="margin:3px 0 5px">' + L.city + ' · clean ' + s.clean.pct + '% · label ' + s.exp.labelPct + '% · ' + s.exp.expired + ' expired</div>' +
        bar(s.overall) + '</span><span class="chev">›</span></button>';
    });
    html += '</div>';

    /* city comparison */
    var A = cityScore('Surat', wk), B = cityScore('Ahmedabad', wk);
    html += '<div class="sec-t">Surat vs Ahmedabad</div><div class="card">' + cityCompare(A, B) +
      '<button class="btn sec sm" style="width:100%;margin-top:12px" data-a="tab" data-x="rep">Full comparison report ›</button></div>';
  }

  /* my tasks for staff/manager */
  if (!p.all) {
    var mine = tasksFor(S.loc, wk).filter(function (t) { return ME.role !== 'staff' || t.assigned === ME.id; });
    var todo = mine.filter(function (t) { return t.status === 'pending' || t.status === 'rejected'; }).slice(0, 5);
    html += '<div class="sec-t">' + (ME.role === 'staff' ? 'My tasks this week' : 'Needs action this week') + '</div><div class="card pad0">';
    html += todo.length ? todo.map(taskRow).join('') : '<div class="empty"><div class="ic">🎉</div>All caught up for this week</div>';
    html += '</div>';
  }

  html += '<div style="height:20px"></div></div>';
  $('#app').innerHTML = html;
  tabbar();
}
function statCard(v, l, c) { return '<div class="stat"><b style="color:' + c + '">' + v + '</b><span>' + l + '</span></div>'; }
function tapStat(v, l, c, act, x) {
  return '<button class="stat" style="border-color:' + (v ? c : 'var(--line)') + ';cursor:pointer" data-a="' + act + '" data-x="' + x + '">' +
    '<b style="color:' + (v ? c : 'var(--mut)') + '">' + v + '</b><span>' + l + '</span></button>';
}
function cityCompare(A, B) {
  var rows = [['Overall score', A.overall, B.overall, '%'], ['Deep cleaning', A.clean, B.clean, '%'],
  ['Labelling', A.label, B.label, '%'], ['Expiry control', A.exp, B.exp, '%'],
  ['Expired items', A.expired, B.expired, ''], ['Expiring ≤7d', A.soon, B.soon, ''],
  ['Pending tasks', A.pending, B.pending, ''], ['Rejected tasks', A.rejected, B.rejected, '']];
  var out = '<div class="row xs b" style="margin-bottom:8px"><div style="width:96px;color:var(--mut)">METRIC</div><div class="grow center">SURAT</div><div class="grow center">AHMEDABAD</div></div>';
  rows.forEach(function (r) {
    var better = r[3] === '%' ? (r[1] > r[2] ? 1 : r[2] > r[1] ? 2 : 0) : (r[1] < r[2] ? 1 : r[2] < r[1] ? 2 : 0);
    out += '<div class="row" style="padding:7px 0;border-top:1px solid var(--line)">' +
      '<div class="sm" style="width:96px">' + r[0] + '</div>' +
      '<div class="grow center b" style="color:' + (better === 1 ? 'var(--grn)' : 'var(--ink)') + '">' + r[1] + r[3] + '</div>' +
      '<div class="grow center b" style="color:' + (better === 2 ? 'var(--grn)' : 'var(--ink)') + '">' + r[2] + r[3] + '</div></div>';
  });
  return out;
}
function pendingApprovals() {
  var wk = S.week, out = [];
  visibleLocations().forEach(function (L) {
    tasksFor(L.id, wk).forEach(function (t) { if (t.status === 'completed' && !t.approved) out.push(t); });
  });
  return out;
}

function scanSheet() {
  var supported = ('BarcodeDetector' in window);
  openSheet('Scan label QR',
    '<div class="card"><div id="scanwrap" style="position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:240px;display:grid;place-items:center">' +
    '<video id="scanvid" playsinline style="width:100%;display:block"></video>' +
    '<div id="scanmsg" style="position:absolute;color:#fff;font-size:13px;text-align:center;padding:16px">Starting camera…</div></div></div>' +
    (supported ? '' : '<div class="card sm" style="background:#e8f0fd;border-color:#c6d8f7"><b>On iPhone, just use the normal Camera app</b><div class="muted" style="margin-top:4px">Point your camera at the label QR and tap the yellow banner that appears — it opens the product in this app. Or type the code below.</div></div>') +
    '<div class="card"><label class="f"><span>Or type the label code</span><input class="inp" id="scanmanual" placeholder="e.g. P-CPP-03"></label>' +
    '<button class="btn sec" data-a="scanGo">Find product</button></div>');
  startScan();
}
var _scanStream = null, _scanTimer = null;
function stopScan() {
  if (_scanTimer) { clearInterval(_scanTimer); _scanTimer = null; }
  if (_scanStream) { _scanStream.getTracks().forEach(function (t) { t.stop(); }); _scanStream = null; }
}
function startScan() {
  var msg = document.getElementById('scanmsg'), vid = document.getElementById('scanvid');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.textContent = 'Camera not available on this device.'; return; }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function (s) {
    _scanStream = s; vid.srcObject = s; vid.play();
    if (!('BarcodeDetector' in window)) { msg.textContent = 'Point at the label QR. (No decoder in this browser — type the code below.)'; return; }
    msg.textContent = 'Point at the label QR…';
    var det = new window.BarcodeDetector({ formats: ['qr_code'] });
    _scanTimer = setInterval(function () {
      det.detect(vid).then(function (codes) {
        if (codes && codes.length) { stopScan(); handleScan(codes[0].rawValue); }
      }).catch(function () { });
    }, 400);
  }).catch(function () { msg.textContent = 'Camera permission denied. Type the label code below.'; });
}
function handleScan(text) {
  var id = null;
  if (text.indexOf('BK|') === 0) id = text.split('|')[2];
  else id = text.trim().toUpperCase();
  var p = DB.products.filter(function (x) { return x.id === id; })[0];
  closeSheet();
  if (p) { productSheet(p.id); toast('Scanned ' + p.name); }
  else toast('No product found for ' + id);
}

function multiScore(loc, weeks) {
  var c = 0; weeks.forEach(function (w) { c += cleaningStats(loc, w).pct; });
  c = Math.round(c / weeks.length);
  var e = expiryStats(loc);
  return { clean: c, label: e.labelPct, exp: e.score, overall: Math.round(0.40 * c + 0.35 * e.score + 0.25 * e.labelPct) };
}
function cityAvg(city, weeks) {
  var ls = LOCATIONS.filter(function (l) { return l.city === city; });
  var a = { clean: 0, exp: 0, label: 0, overall: 0, expired: 0, soon: 0, pending: 0, rejected: 0 };
  ls.forEach(function (L) {
    var m = multiScore(L.id, weeks), s = scoreFor(L.id, weeks[0]);
    a.clean += m.clean; a.exp += m.exp; a.label += m.label; a.overall += m.overall;
    a.expired += s.exp.expired; a.soon += s.exp.soon; a.pending += s.clean.pending; a.rejected += s.clean.rejected;
  });
  ['clean', 'exp', 'label', 'overall'].forEach(function (k) { a[k] = Math.round(a[k] / ls.length); });
  return a;
}
/* monthly jobs belong to several weeks, so de-duplicate by task id */
function uniqueTasks(loc, weeks) {
  var seen = {}, out = [];
  weeks.forEach(function (w) {
    tasksFor(loc, w).forEach(function (t) { if (!seen[t.id]) { seen[t.id] = 1; out.push(t); } });
  });
  return out;
}
function violations(scope, weeks) {
  var v = { clean: [], exp: [], lab: [] }, td = ymd(today());
  scope.forEach(function (L) {
    uniqueTasks(L.id, weeks).forEach(function (t) {
      if (t.status === 'rejected') v.clean.push({ loc: L.id, t: t.area, d: 'Rejected: ' + (t.reject || '—'), id: t.id });
      else if (t.status === 'pending' && daysBetween(td, t.due) < 0) v.clean.push({ loc: L.id, t: t.area, d: 'Overdue since ' + fmtD(t.due), id: t.id });
      else if (t.status !== 'pending' && (!t.before || !t.after)) v.clean.push({ loc: L.id, t: t.area, d: 'Photo evidence incomplete', id: t.id });
    });
    productsFor(L.id).forEach(function (p) {
      var st = expiryState(p.expiry);
      if (st.k === 'expired') v.exp.push({ loc: L.id, t: p.name, d: 'Expired ' + fmtD(p.expiry) + ' · batch ' + p.batch, id: p.id, prod: 1 });
      else if (st.k === 'soon') v.exp.push({ loc: L.id, t: p.name, d: 'Use by ' + fmtD(p.expiry) + ' (' + st.days + 'd)', id: p.id, prod: 1 });
      if (!p.labelled) v.lab.push({ loc: L.id, t: p.name, d: 'No label · batch ' + p.batch, id: p.id, prod: 1 });
    });
  });
  return v;
}
function vioBlock(title, list) {
  if (!list.length) return '<div class="sec-t">' + title + '</div><div class="card sm muted center">None recorded ✓</div>';
  return '<div class="sec-t">' + title + ' (' + list.length + ')</div><div class="card pad0">' +
    list.slice(0, 12).map(function (x) {
      return '<button class="lrow" data-a="' + (x.prod ? 'product' : 'task') + '" data-x="' + x.id + '"><span class="grow">' +
        '<span class="t sm trunc">' + h(x.t) + '</span><div class="xs muted">' + h(lname(x.loc)) + ' · ' + h(x.d) + '</div></span><span class="chev">›</span></button>';
    }).join('') + (list.length > 12 ? '<div class="xs muted center" style="padding:9px">+' + (list.length - 12) + ' more in the exported report</div>' : '') + '</div>';
}
function staffStats(scope, weeks) {
  var m = {};
  scope.forEach(function (L) {
    uniqueTasks(L.id, weeks).forEach(function (t) {
      var k = t.completedBy || t.assigned;
      m[k] = m[k] || { name: uname(k), loc: L.id, total: 0, ok: 0 };
      m[k].total++; if (t.status === 'completed' && t.approved) m[k].ok++;
    });
  });
  return Object.keys(m).map(function (k) {
    var r = m[k]; r.pct = Math.round((r.ok / (r.total || 1)) * 100); return r;
  }).sort(function (a, b) { return b.pct - a.pct; });
}
function photoEvidence(scope, weeks) {
  var out = [];
  scope.forEach(function (L) { uniqueTasks(L.id, weeks).forEach(function (t) { if (t.before || t.after) out.push(t); }); });
  return out;
}
function csvExport() {
  var weeks = S.repRange === 'week' ? [S.week] : recentWeeks(4), scope = visibleLocations();
  var rows = [['Location', 'City', 'Week', 'Month', 'Cleaning %', 'Weekly jobs %', 'Monthly jobs %', 'Labelling %', 'Expiry %', 'Overall', 'Expired', 'Expiring7d', 'Pending', 'Rejected', 'MissingPhotos']];
  scope.forEach(function (L) {
    weeks.forEach(function (w) {
      var c = cleaningStats(L.id, w), e = expiryStats(L.id);
      rows.push([L.name, L.city, w, monthOfWeek(w), c.pct, cleaningStats(L.id, w, 'W').pct, cleaningStats(L.id, w, 'M').pct,
        e.labelPct, e.score, Math.round(0.4 * c.pct + 0.35 * e.score + 0.25 * e.labelPct),
        e.expired, e.soon, c.pending, c.rejected, c.noPhoto]);
    });
  });
  var csv = rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'bookends-compliance-' + ymd(today()) + '.csv';
  a.click();
  toast('CSV exported');
}

var deferredInstall = null;
function initPWA() {
  /* offline / online banner */
  function net() {
    var b = document.getElementById('netbar');
    if (navigator.onLine) { if (b) b.remove(); }
    else if (!b) {
      var d = document.createElement('div');
      d.id = 'netbar'; d.className = 'netbar';
      d.textContent = 'No internet — your work is being saved and will upload automatically';
      document.body.appendChild(d);
    }
  }
  window.addEventListener('online', function () { net(); if (Cloud.on()) Cloud.sync(false); });
  window.addEventListener('offline', net);
  net();

  /* add to home screen */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredInstall = e; });

  /* android/desktop back button closes the open sheet instead of leaving the app */
  window.addEventListener('popstate', function () {
    if ($('#modal').innerHTML) { stopScan(); closeSheet(); history.pushState({ app: 1 }, ''); }
  });
  history.pushState({ app: 1 }, '');

function saveProduct() {

  if (!window._form.photo) { toast('Take a photo of the product first'); return; }

    var p = DB.products.filter(function (x) { return x.id === id; })[0];
    p.name = name; p.cat = g('f_cat'); p.batch = g('f_batch'); p.qty = +g('f_qty'); p.unit = g('f_unit');
    p.opened = g('f_opened'); p.expiry = g('f_expiry'); p.storage = g('f_storage');

  } else {
    var loc = window._formLoc;
    var np = {
      id: 'P-' + locById(loc).code + '-' + (100 + DB.products.length), loc: loc, name: name, cat: g('f_cat'),
      batch: g('f_batch'), qty: +g('f_qty'), unit: g('f_unit'), opened: g('f_opened'), expiry: g('f_expiry'),
      storage: g('f_storage'), photo: window._form.photo || null, labelled: false, labelledAt: null,

}
