    var loc = S.loc, f = S.expFilter;
    var list = productsFor(loc).filter(function (p) { return f === 'all' || expiryState(p.expiry).k === f; })
      .filter(function (p) { return !S.q || (p.name + p.batch + p.cat).toLowerCase().indexOf(S.q.toLowerCase()) > -1; })
      .sort(function (a, b) { return parseD(a.expiry) - parseD(b.expiry); });
    var card = document.querySelectorAll('#app .card.pad0');
    if (card.length) card[card.length - 1].innerHTML = list.length ? list.map(prodRow).join('') : '<div class="empty"><div class="ic">📦</div>No match</div>';
  }
});
function saveProduct() {
  var g = function (id) { return document.getElementById(id).value; };
  var name = g('f_name').trim();
  if (!name) { toast('Product name is required'); return; }
  if (parseD(g('f_expiry')) < parseD(g('f_opened'))) { toast('Expiry cannot be before the opening date'); return; }
  var id = window._formId;
  if (!window._form.photo) { toast('Take a photo of the product first'); return; }
  if (id) {
    var p = DB.products.filter(function (x) { return x.id === id; })[0];
    p.name = name; p.cat = g('f_cat'); p.batch = g('f_batch'); p.qty = +g('f_qty'); p.unit = g('f_unit');
    p.opened = g('f_opened'); p.expiry = g('f_expiry'); p.storage = g('f_storage');
    if (window._form.photo) p.photo = window._form.photo;
    save('products', p); logAct('product', 'Updated: ' + p.name, p.loc); closeSheet(); render(); toast('Product updated');
  } else {
    var loc = window._formLoc;
    var np = {
      id: newProductId(loc), loc: loc, name: name, cat: g('f_cat'),
      batch: g('f_batch'), qty: +g('f_qty'), unit: g('f_unit'), opened: g('f_opened'), expiry: g('f_expiry'),
      storage: g('f_storage'), photo: window._form.photo || null, labelled: false, labelledAt: null,
      by: ME.id, initials: initials(ME.name), createdAt: Date.now()
    };
    DB.products.push(np); save('products', np); logAct('product', 'Added: ' + np.name, loc);
    uploadProductPhoto(np);
    closeSheet(); render(); labelSheet(np.id); toast('Added — print the label now');
  }
}

document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  var id = ev.target && ev.target.id;
  if (id === 'l_uid' || id === 'l_pw') { ev.preventDefault(); doLogin(); }
  else if (id === 'p_new' || id === 'p_new2') { ev.preventDefault(); savePw(!!ME && ME.mustChange); }
});

/* A QR label scanned with the phone camera opens .../#p=P-CPP-01 */
function handleDeepLink() {
  var m = (location.hash || '').match(/^#p=([A-Za-z0-9\-]+)$/);
  if (!m) return;
  PENDING_LINK = m[1];
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { }
}
var PENDING_LINK = null;
function openPendingLink() {
  if (!PENDING_LINK || !ME || ME.mustChange) return;
  var id = PENDING_LINK; PENDING_LINK = null;
  var p = DB.products.filter(function (x) { return x.id === id; })[0];
  if (p) { S.loc = perm().all ? p.loc : S.loc; productSheet(p.id); }
  else toast('That label is not in the system yet');
}

/* ---------------- boot ----------------

   Start-up is now asynchronous, because establishing the session means
   asking the server whether the refresh cookie on this device is still
   good. A brief "Signing you in…" card covers that round trip instead of
   flashing the login screen at someone who is already signed in. */

function renderBooting() {
  $('#tabbar').innerHTML = '';
  $('#app').innerHTML =
    '<div class="hdr" style="padding-bottom:26px"><div class="hdr-row"><h1 style="font-size:20px">BOOKENDS<small>Kitchen Operations &amp; Compliance</small></h1></div></div>' +
    '<div class="wrap"><div class="card center"><div class="sm muted">Signing you in…</div></div></div>';
}

/* Starts sharing data with the other devices. Only once signed in: the
   server needs to know who is asking before it hands over any records. */
function startSync() {
  Cloud.start();
  setTimeout(retryPhotoUploads, 3000);
}

load();
handleDeepLink();
Cloud.load();
initPWA();
S.week = weekId(today());
S.rangeFrom = ymd(mondayOf(today()));
S.rangeTo = ymd(addDays(mondayOf(today()), 6));

renderBooting();

Auth.boot(function () {
  S.loc = ME ? (ME.loc || 'ALL') : 'ALL';
  /* ensureJobs() assigns each new job to a location's manager, so it needs
     the roster. It now runs after the roster has arrived rather than before. */
  if (ME) ensureJobs();
  render();
  refreshPendingSignups();
  if (ME && !Auth.offline && !ME.mustChange) startSync();
  if (Auth.offline) toast('No connection — showing the work saved on this device');
});
</script></body></html>
